# Infraestructura de datos: cachés, timeouts y reintentos.

[fetcher]                       # lib/data_fetcher.py
max_retries = 4                 # reintentos ante rate limit
base_delay_s = 3                # backoff: base × 2^intento + U(0,1)
max_delay_s = 45
parallel_task_timeout_s = 30
thread_pool_workers = 4
cache_default_ttl_min = 30      # SimpleCache compartido
cache_class_default_ttl_min = 15  # default del constructor de SimpleCache
cache_max_entries = 500
profile_ttl_min = 30
financials_ttl_min = 60

[yahoo]                         # lib/yf_adapter.py
cache_ttl_s = 300
cache_ttl_degraded_s = 60
# Etapa 11b: tras un 401 de quoteSummary (crumb inválido desde IPs de datacenter, Render) se
# va directo al plan B durante este tiempo, sin repetir sesión, crumb y dos 401 por análisis.
quotesummary_block_ttl_s = 600
last_known_good_max_age_s = 86400
degraded_retry_sleep_step_s = 0.8
http_timeout_s = 15
statements_timeout_s = 30
search_timeout_s = 8
impersonate_profiles = ["chrome", "safari15_5", "edge101"]
completeness_fields = ["beta", "sharesOutstanding", "marketCap", "totalRevenue", "operatingCashflow", "totalCash"]

[finnhub]                       # lib/finnhub_fallback.py
timeout_s = 8
cache_ttl_s = 300
gap_fields = ["beta", "forwardPE", "revenueGrowth"]
cut_match_rel_tol = 0.02        # fase 2b: una métrica TTM de Finnhub entra solo si casa con el corte a ±2%

[edgar]                         # lib/sec_edgar.py (fase 2b): SEC EDGAR en el camino del análisis (D2: verificación y respaldo)
user_agent_env = "SEC_EDGAR_USER_AGENT"   # nombre y correo de contacto; lo pone el usuario en Render. Sin él, desactivado
budget_s = 3.0                  # tiempo máximo de EDGAR por análisis (propuesta de la 2a); si se agota, se sigue sin EDGAR
min_interval_s = 0.12           # ≤ 8.3 peticiones/s (la SEC admite 10/s)
timeout_s = 2.5                 # por petición (nunca más que lo que queda del presupuesto)
tickers_ttl_s = 86400           # company_tickers.json: caché diaria
submissions_ttl_s = 21600       # lista de filings por CIK: 6 h (un 8-K de resultados aparece el mismo día)
report_date_tolerance_days = 14 # Yahoo fecha el trimestre a fin de mes; EDGAR, al cierre real (JNJ 06-28)
since = "2024-01-01"            # filings que se miran
# Emisores sin 8-K (20-F/40-F): calendario de resultados del proveedor (Finnhub). Una publicación más de
# `calendar_min_lag_days` días después del corte es de un periodo posterior (la del propio corte llega antes: TSM
# +16, TM +35, UL y BCS +28–31 días; la siguiente, a +105–130).
calendar_min_lag_days = 70
# T4: hechos XBRL (companyfacts y las instancias de los filings que aún no trae; F2_PRECEDENCIA §3.1)
facts_ttl_s = 86400             # companyfacts, instancias y portadas: caché diaria por CIK / filing
max_pending_filings = 3         # filings pendientes que se leen por análisis (los más recientes; ~0.5–1.4 s cada uno)
# D7 (F2_PRECEDENCIA §4): con CIK, pero el último informe anual tiene más de estos meses o EDGAR va por detrás
# (un filing pendiente sin leer) → "verificado con el FY X" (nota informativa, sin tope de confianza).
annual_stale_months = 15
# F2_PRECEDENCIA §2.1 (escenario B): el beneficio operativo de Yahoo se marca "estimado por la fuente" si difiere más
# que esto del de EDGAR en el mismo periodo (Yahoo construye el suyo: KO, PLD, AMT, NEE, DUK, FCX, CRWD, UL, V).
ebit_estimate_rel_tol = 0.02
fy_backup_years = 4              # ejercicios de los estados anuales que el respaldo completa (FY0–FY3: Piotroski y CAGR a 3 años)
# Fase 3 (T1b; F3_T1_PARADA1 §2.2): la historia larga vive en la caché en memoria (Render: 512 MB y disco efímero).
# Un companyfacts reducido pesa 0.3–0.45 MB; leer uno grande sube el proceso 80–116 MB un instante.
cache_max_issuers = 64           # emisores por tipo de entrada en la caché (LRU): ≤ ~30 MB de hechos reducidos
parse_concurrency = 1            # lecturas grandes a la vez (companyfacts e instancias): acota el pico de memoria

[edgar.predecessors]            # sucesión de emisor: el ticker apunta al CIK nuevo y la historia XBRL sigue en el anterior
# XOM: reorganización en holding (8-K12B de ExxonMobil Holdings Corp, CIK 2115436, del 2026-07-01); los estados hasta
# el 1T-2026 están en Exxon Mobil Corp (CIK 34088). Verificado en la 2a (tests/edgar.py, PREDECESSORS).
XOM = [34088]

[edgar.captive]                 # deuda de financieras cautivas (T5): solo se separa y se declara; usarla es de la fase 3
# CAT: Cat Financial ("Financial Products"), verificado en el 10-Q del 2T-2026 (2026-08-05): largo plazo 21,384 +
# parte corriente 8,026 + préstamos a corto 5,046 millones de USD, con dimensión ProductOrServiceAxis.
CAT = { name = "Cat Financial", axis = "ProductOrServiceAxis", member = "FinancialProductsMember" }
