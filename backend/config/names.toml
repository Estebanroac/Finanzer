# P8 (retoque 2): nombre corto de la empresa en el cintillo de la portada (lib/names.py `company`, universe
# `display_name`). Se quitan las formas jurídicas finales; el nombre legal del universo no cambia (lo usa
# tools/build_universe.py para emparejar con Damodaran). tests/test_names.py lo comprueba sobre todo el universo.
[company]
# Al final del nombre, con o sin coma delante. «ci»: sin distinguir mayúsculas (EDGAR escribe «INC», «LTD»).
suffixes_ci = ["Inc.", "Inc", "Corp.", "Corp", "Corporation", "Ltd.", "Ltd", "Limited", "plc", "p.l.c."]
suffixes = ["N.V.", "NV", "S.A.", "AG", "SE", "A S", "A/S"]
# Solo al final y tras coma («Deere & Company» se queda; «Foo, Holdings» pierde «Holdings»).
after_comma = ["Co.", "Co", "Company", "Holdings"]
# Sufijo de estado o país de EDGAR («TOYOTA MOTOR CORP/», «ARM HOLDINGS PLC /UK», «BROOKFIELD Corp /ON/»).
edgar_state = '\s*/[A-Z]{0,3}/?$'
# Nombre legal → nombre corto, cuando la regla no basta (artículo delante, nombres en mayúsculas de EDGAR).
[company.exceptions]
"The Coca-Cola Company" = "Coca-Cola"
"Coca-Cola Company (The)" = "Coca-Cola"
"Walt Disney Company (The)" = "Disney"
"Hershey Company (The)" = "Hershey"
