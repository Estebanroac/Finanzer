# V7 (nombres en español): industrias y sectores de las fuentes → nombre en español para la prosa y las fichas de la
# web y de los PDF (lib/names.py). El nombre original solo queda en la metodología y en el anexo («industria de
# referencia: Computers/Peripherals, Damodaran»).
#
# - damodaran: las industrias de config/industries.toml (A. Damodaran, NYU Stern), todas las regiones.
# - yahoo_sectors / yahoo_industries: el sector y la industria del perfil de Yahoo Finance. Yahoo escribe la industria
#   con raya («Beverages—Non-Alcoholic») o con guion («Beverages - Non-Alcoholic»): la clave usa « - » y lib/names.py
#   normaliza las dos formas.
# - gics_sectors: los sectores GICS del universo (config/universe.tsv).
#
# tests/test_names.py comprueba que ninguna industria del universo, de config/industries.toml ni del panel queda sin
# traducción, y el guardián (regla `industria_en_ingles`) que la prosa no use el nombre original.

