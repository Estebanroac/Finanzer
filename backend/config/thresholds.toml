[confidence]                        # confianza del veredicto (spec Sección 3; etapa 8: se muestra, no limita)
# F13 · 3c (opción (a) con matiz): lo que el ciclo hizo en las cifras de una cíclica, en el motivo de su «baja».
cycle_real_drop = 0.20              # una caída anual del beneficio de al menos un 20 % es una caída real
cycle_margin_min_years = 3          # ejercicios con margen operativo para dar su recorrido
level_values = [1.0, 0.5, 0.0]      # alta / media / baja
overall_bounds = [0.75, 0.45]       # media ponderada >= 0.75 alta; >= 0.45 media; resto baja
upside_scale = 0.5                  # un upside de ±50% equivale a la señal ±1
neutral_band = 0.2                  # |señal| <= 0.2 (±10% de upside): "en precio", la misma banda que el DCF en Valoración
# Distancia máxima entre señales para "alta": 0.6 = 30 pp de upside, la distancia entre "en precio"
# y "claramente barata/cara" de las bandas del DCF. Si dos métodos difieren más que eso, coinciden
# en dirección pero no en magnitud (media). Los múltiplos dan una señal de bandas, no un upside:
# la escala es común solo de forma aproximada.
convergence_spread_max = 0.6
convergence_extreme_reading = 1.0   # F8 · E4: un múltiplo con lectura ±1 contraria a la dirección común impide «alta»
no_evaluable_cap = "media"          # techo de la confianza si la convergencia es media (fase 3: no evaluable ya no pone techo, opción 3 de §7.17)
no_official_source_cap = "baja"     # fase 2b (D7): techo de la confianza de un emisor sin estados en la SEC (F2_PRECEDENCIA §4)
# F10 · N4 (revisión del informe de NVIDIA): si el DCF inverso exige un crecimiento que, según las tasas base
# (Mauboussin y Callahan), sostuvo menos de esta fracción de las comparables, la confianza baja un escalón. El precio no
# se toca (la auditoría, §2: las tasas base son contexto que no puntúa); solo cuánto fiarse del veredicto.
base_rate_min_share = 0.05
# Fase 4 (T2): reglas de la validación que no son incidencias del dato usado: el dato de otro periodo que no entra
# (el análisis usa el del corte), la beta del proveedor cuando se usa la propia y las métricas no significativas por la
# economía de la empresa (EBIT < 0, múltiplo negativo). Las reglas de "politica" tampoco cuentan. El resto, sí: datos
# imposibles, unidades, saltos, márgenes fuera de rango (rechazados) y la validación que no se ejecutó.
source_ignored_rules = ["periodo_incoherente", "beta_discrepante", "multiplo_no_significativo", "ratio_no_significativa"]
coverage_bounds = [0.9, 0.7]        # componentes evaluados / aplicables: >= 0.9 alta; >= 0.7 media
source_issue_bounds = [0, 2]        # incidencias de fuente: 0 alta; <= 2 media; más, baja
excluded_multiple_components = ["DCF", "Regla de 40"]   # no son múltiplos frente al sector (prefijos: F13 · paso 3)
fragile_pe_gap = 0.40               # F13 · paso 3: |P/E normalizado ÷ forward − 1| mayor -> base frágil (techo media)
# F14 · paso 3 (segunda revisión externa): señales graves de la base del veredicto, techo «baja». Altman en peligro con
# uno de estos ratings sintéticos (grado especulativo, como sectors.toml [sector_risks]) y un DCF a más de este múltiplo
# del precio en cualquier sentido (CMCSA +239 %, GM +164 %).
grave_ratings = ["BB+", "BB", "BB-", "B+", "B", "B-", "CCC", "CC", "C", "D"]
extreme_dcf_upside = 1.5

[confidence.weights]
convergence = 0.4
coverage = 0.2
source = 0.2
stability = 0.2

[normalization]
one_off_pct = 0.10                  # |no recurrentes netos| / beneficio neto > 10% -> P/E reportado no fiable
label_min_diff = 0.001              # etapa 9a: etiqueta "normalizado" solo si difiere del reportado > 0.1%
robust_z = 3.5                      # pico no operativo: |z robusto (mediana, MAD)| > 3.5 (Iglewicz-Hoaglin)
min_quarters = 4                    # trimestres con resultado no operativo necesarios para inferir picos
min_share_of_pretax = 0.03          # y el exceso debe ser >= 3% del beneficio antes de impuestos TTM
mad_floor_share_of_pretax = 0.01    # suelo de la escala (MAD): 1% del beneficio antes de impuestos trimestral medio
tax_rate_bounds = [0.0, 0.35]       # tipo efectivo TTM acotado
default_tax_rate = 0.21             # sin tipo efectivo calculable
# Recurrencia: mismo tipo y signo en >= 3 de los últimos 4 ejercicios -> solo el exceso sobre su promedio.
recurrence_min_years = 3
recurrence_window = 4
# Los componentes (cargos especiales + ganancias por venta) se usan como tipos si cuadran con el total.
components_tolerance = 0.05         # relativo al total
components_tolerance_abs = 1000000.0
# F10 · N1 (revisión del informe de NVIDIA, 28-oct-2026): coherencia del beneficio con la operación. Tras las partidas
# anteriores, el beneficio no puede superar lo que explican la operación y la caja: (resultado operativo + financieros
# netos + participadas por puesta en equivalencia) × (1 − tipo efectivo). Lo que lo supera en más de esta fracción de
# los ingresos son ganancias no operativas (NVDA: ganancias de sus inversiones en acciones, GainLossOnInvestments,
# 15,9 B$ en el trimestre de abril de 2026 que Yahoo no marca como inusuales): salen del beneficio que puntúa (P/E
# normalizado, ROE, margen neto) y se dicen con su cifra. 2 pp de margen: la tolerancia que propuso el revisor
# (impuestos diferidos, redondeos, otros ingresos pequeños). Continua: sale solo lo que pasa de la tolerancia.
nonoperating_tolerance_revenue = 0.02
# F13 (SRE y Oncor): las participadas netas de impuestos son operativas hasta su nivel recurrente, la mediana de los
# `equity_recurrence_years` últimos ejercicios (al menos `equity_recurrence_min_years` con dato); el pico, no
equity_recurrence_years = 3
equity_recurrence_min_years = 2
# F10 · N1b (escaneo de control del 29-oct): también después de impuestos, con el tipo normalizado: la mediana de los
# tipos efectivos (negativos incluidos desde F13 · 6b) del periodo y de los últimos `tax_median_years` (un beneficio fiscal puntual queda fuera;
# uno recurrente es su tipo). Con menos de `tax_median_min` válidos, el tipo legal (valuation.tax.statutory_rate).
tax_median_years = 5
tax_median_min = 3
# F13 · paso 6b (revisión de 110 empresas, XEL): un tipo negativo también entra en la mediana si no baja de esto. Antes
# se descartaba, y una utility con créditos fiscales todos los años (XEL: −4,6 %, −8,4 %, −9,0 %, −26,2 %, −13,8 % en
# 2021–2025; créditos de 0,57 B$ en 2025) se leía al tipo legal del 21 %: la normalización le quitaba 0,60 B$ (22,5 %
# del beneficio) como «no explicado por la operación». Un beneficio fiscal puntual sigue fuera por la mediana, y por
# debajo de este suelo no es un tipo sino un suceso (UBER: liberación de la provisión fiscal, −46 % a −140 %): fuera.
tax_median_floor = -0.30
# F10 · margen operativo con una sola verdad (puerta de la v4, 29-oct): los tipos de partida que pueden ir DENTRO del
# resultado operativo: cargos especiales (deterioros, litigios, reestructuración, amortizaciones extraordinarias), ventas
# de negocios o de activos fijos (SOLV, BA) y el total de Yahoo cuando sus componentes no cuadran. Sus importes ya
# normalizados (solo el exceso no recurrente, aplicados) salen también del margen operativo que puntúa, como del margen
# neto, en las dos direcciones. Cuánto va dentro lo decide la identidad del estado (normalize.operating); las ganancias
# por venta de valores y los picos no operativos inferidos van debajo.
operating_item_types = ["Special Income Charges", "Restructuring And Mergern Acquisition", "Write Off",
                        "Asset Impairment Charge", "Impairment Of Capital Assets", "Other Special Charges",
                        "Gain On Sale Of Business", "Gain On Sale Of Ppe", "Total Unusual Items",
                        "Total Unusual Items Excluding Goodwill", "EDGAR: cargos", "EDGAR: ventas"]

# ── Crecimiento (etapa 7) ──
[growth]
per_share_min_shares_cagr = 0.02   # acciones +2% anual compuesto en la ventana -> crecimiento por acción
anomalous_base_ratio = 0.5          # año inicial < 0.5 × mediana de los demás -> regresión log-lineal
inflated_base_ratio = 1.5           # F13 · paso 12: año inicial > 1,5 × mediana de los demás (la medida del paso) -> igual
perimeter_min_years = 2             # fase 3 (T5): años homogéneos mínimos tras un cambio de perímetro; menos: no comparable
# F13 · paso 7 (revisión de 110 empresas, patrón 5): una reexpresión que cambia los ingresos al menos esto es otra
# empresa (GE: −62 % sin GE HealthCare ni GE Vernova). La historia larga de EDGAR anterior al primer ejercicio
# reexpresado no cuenta para la ciclicidad ni para el ciclo medio del DCF (GE salía cíclica por 2009 y 2017, episodios
# del conglomerado con GE Capital). Por debajo (HON −10 %: Solstice) la historia sigue siendo la de la empresa.
perimeter_history_break = 0.30
# F10 · crecimiento desde una base anómala (escaneo de control del 29-oct, 46 empresas): con año base anómalo, la
# regresión sobre solo los 4 ejercicios de la ventana sigue dependiendo de él (NVDA: 198 % frente al 204 % del CAGR). Si
# no hay más ejercicios en los estados, la serie larga de EDGAR: al menos estos ejercicios contiguos hasta el último (la
# regresión tiene así ejercicios fuera de la ventana con los que diluir el anómalo). Sin ella, no significativo.
long_years = 6
# F12 · D2 (decisión del usuario, 5-nov-2026): el crecimiento que RESPALDA un forward no se mide desde un año base
# deprimido frente a la historia de la empresa: el inicial de la ventana de 3 años frente a la mediana de la serie
# larga (de backing_min_years a backing_max_years ejercicios), con la misma razón de base anómala.
backing_min_years = 5
backing_max_years = 10

# ── Fase 3 (T6): lecturas de calidad que informan y no puntúan (lib/quality_readings.py) ──
[quality_readings]
fcf_margin_trend_pp = 0.02          # cambio del margen FCF − SBC entre el primer y el último ejercicio: mejora / empeora
rule_of_40 = 0.40                   # listón de la regla de 40 (crecimiento + margen FCF − SBC)
sbc_material = 0.05                 # SBC > 5% de los ingresos: se lee como coste real (F3_DISENO §5)
coverage_trend_rel = 0.20           # cobertura con el EBIT de cada ejercicio: ±20% entre extremos -> mejora / empeora
coverage_display_max = 100.0        # V7 (M3): por encima, "más de 100 veces" (PLTR: 526930.4 veces no informa más)

[premortem]                         # fase 4 (T3, PLAN §4.3; lib/premortem.py): "Esta lectura sería errónea si…"
margin_gap_rel = 0.20               # margen operativo de hoy > 120% del de referencia: la lectura depende de que se mantenga
margin_years = 10                   # mediana del margen de los últimos 10 ejercicios de EDGAR (un ciclo largo)
min_margin_years = 5                # con menos, sin referencia (no se afirma una media)
max_items = 3

[quality_persistence]               # fase 4 (T1, PLAN §4.1; lib/persistence.py): lo extraordinario exige persistencia
# La calidad por encima del codo (`knee`) cuenta en proporción a la persistencia de las categorías que la llevan ahí:
# hasta el codo no cambia y lo que está por encima (lo extraordinario) exige historia.
window = 5                          # ejercicios: un ciclo económico corto y el horizonte habitual del análisis de calidad
margin_ratio = 0.75                 # el margen de cada ejercicio, al menos el 75% del actual (el de hoy no es un pico)
# F8 · E11: el codo a partir del cual cuenta la persistencia. Era el umbral de «excelente» (80); al subir esa etiqueta a
# 85 se separa para que el cambio sea solo de etiqueta: la puntuación no varía y la persistencia no se afloja.
knee = 80

