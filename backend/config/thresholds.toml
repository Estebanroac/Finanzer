# Bandas del score, de las alertas y de las lecturas del PDF.
# Convención: `*_bounds` son los umbrales en el orden en que se evalúan en el
# código (if/elif) y `*_points` los puntos de cada tramo; el último punto es
# el del `else`. El operador de comparación (>=, >, <=) sigue en el código.

[score.category]                    # las 5 categorías: base 10, rango [0, 20]
base = 10
min = 0
max = 20

[score.category_labels]             # V7 (PM): cómo se escribe cada categoría al enseñarla (web e informe). Las claves son
# las del motor (financial_ratios, [score.quality]/[score.price] categories, persistence): no cambian. Sin entrada, la
# categoría se enseña con su clave.
"Solidez Financiera" = "Solidez financiera"
"Calidad de Ganancias" = "Calidad de ganancias"

[score.coverage]                    # etapa 5: cobertura por categoría
# Una categoría con menos del 60% de sus componentes con dato se marca de baja
# confianza (no cambia el score; lo usará la etapa 8). Criterio: con 3-5
# componentes por categoría, 60% exige la mayoría (3/5, 2/3); 2/4 ya queda bajo.
low_confidence_below = 0.6
# Por debajo del 50% la categoría no se reescala: queda excluida del total (que
# se reescala a 100 sobre las demás) y se informa como no concluyente.
min_conclusive = 0.5

[score.solidez]                     # score_solidez_financiera
# SAFE / GREY / DISTRESS. F8 · E10 (auditoría del 26-oct, peso en el score; aprobado por el PM el 27-oct): antes
# [6, -2, -6], el mayor componente de Solidez. Fuera de la muestra original su poder discriminante cae: AUC ≈ 0,75
# (Altman, Iwanicz-Drozdowska, Laitinen y Suvas, 2017, «Financial Distress Prediction in an International Context: A
# Review and Empirical Analysis of Altman's Z-Score Model», J. of International Financial Management & Accounting
# 28(2); la auditoría la cita como «precisión de alrededor de 0,75»). La información por encima del azar es
# 2·AUC − 1 = 0,5, así que el peso se reduce a la mitad: el mismo que la cobertura de intereses. «Referencial» (fuera
# del denominador, F8 · E10 de las independientes), «no aplica» y «sin dato» siguen neutros.
altman_points = [3, -1, -3]
current_bounds = [2.0, 1.5, 1.0, 0.8]
current_points = [4, 2, 0, -2, -4]
de_mults = [0.5, 1.3, 1.6]          # × umbral D/E del sector (tramos: ≤0.5×, ≤1×, ≤1.3×, ≤1.6×)
de_points = [5, 2, 0, -2]
de_mitigation_coverage = 10         # D/E alto pero cobertura ≥ 10x -> penalización mitigada
de_mitigated_points = -2
de_severe_points = -5
coverage_bounds = [10, 5, 3, 1.5]
coverage_points = [3, 1, 0, -2, -3]
# Runway (GROWTH_PRE_PROFIT, sustituye a Altman; nació con su mismo peso y lo conserva tras F8 · E10, porque la
# rebaja de Altman es por su validez estadística fuera de muestra y el runway es caja medida, no un modelo): años de
# (caja + inversiones a corto plazo) / quema anual de FCF. FCF TTM >= 0 =
# autofinanciada = mejor tramo. >= 3 años aguanta un cierre de mercado de
# capitales de unos 2 años (2022-23) con margen; 2-3, cómodo; 1-2, tendrá que
# financiarse dentro del horizonte del plan; < 1, financiación urgente y
# probablemente dilutiva antes del próximo ejercicio.
runway_bounds = [3.0, 2.0, 1.0]     # años: ≥3 / ≥2 / ≥1 / <1
runway_points = [6, 2, -2, -6]
# REIT (etapa 9a): la métrica de apalancamiento es deuda neta/EBITDA con bandas de
# REIT (el D/E queda informativo). Un REIT con grado de inversión suele operar en
# 5–6.5x; > 7.5x es elevado y > 9x alto. PROVISIONAL. Fase 7 (F7_CALIBRACION §4): 26 REIT, mediana 5.3x en el
# tramo ≤6.5, pero el tramo ≤5 recoge el 40% (en el límite del criterio) y parte de esa cola es deuda que el
# estudio no capta (etiquetas de los REIT): sin veredicto firme.
reit_nde_bounds = [5.0, 6.5, 7.5, 9.0]   # ≤5 conservador / ≤6.5 adecuado / ≤7.5 en línea / ≤9 elevado / alto
reit_nde_points = [4, 2, 0, -2, -4]
# Etapa 11b: UTILITY regulada, deuda neta/EBITDA (contrastada en la fase 7, F7_CALIBRACION §4: 25 utilities,
# 342 empresa-año, mediana 5.1x; bien centrada). Una utility con grado de
# inversión opera en 5.5–6.5x (base regulada financiada con deuda): ≤4.5 conservadora /
# ≤5.5 adecuada / ≤6.5 en línea / ≤7.5 elevada / alta.
utility_nde_bounds = [4.5, 5.5, 6.5, 7.5]
utility_nde_points = [4, 2, 0, -2, -4]
# Etapa 11b: UTILITY, cobertura de intereses (EBIT / intereses; contrastada en la fase 7: mediana 2.9x, bien centrada). Una utility
# regulada opera con 2.5–3.5x: ≥3.5 fuerte / ≥2.5 adecuada / ≥2.0 en línea / ≥1.5 ajustada / riesgo.
utility_coverage_bounds = [3.5, 2.5, 2.0, 1.5]
utility_coverage_points = [3, 1, 0, -2, -3]

[score.solidez_financial]           # score_solidez_financiera_financial (bancos)
max_without_regulatory = 18         # sin CET1/Tier 1 el máximo es 18/20
health_offset = 4                   # solidez = 4 + salud × 1.4
health_multiplier = 1.4
de_points = [3, 2, 0, -2]           # tramos de sectors.financials.benchmarks.de_*
pb_points = [2, 1, 0, -1]           # tramos de pb_cheap / pb_fair / pb_expensive

[score.rentabilidad]                # score_rentabilidad
negative_equity_min_roa = 0.03      # ROE < 0 con ROA > 3%: patrimonio negativo por recompras, no se penaliza
min_equity_to_assets = 0.05         # F13 · 5c: patrimonio < 5 % de los activos (no financieras): ROE «n.s.», no puntúa
roe_high_mult = 1.25                # tramos: ≥1.25×roe_high / ≥roe_high / ≥roe_low / ≥5% / ≥0 / <0
roe_floor = 0.05
roe_points = [6, 4, 2, -2, -4, -6]
roa_high_mult = 1.25                # tramos: ≥1.25×roa_high / ≥roa_high / ≥roa_low / ≥0 / <0
roa_points = [4, 2, 0, -2, -4]
operating_margin_bounds = [0.30, 0.20, 0.10, 0.05]   # y luego ≥0 / <0 (no sectorial)
operating_margin_points = [5, 3, 1, -1, -3, -5]
net_margin_bounds = [0.20, 0.10, 0.05]               # y luego ≥0 / <0
net_margin_points = [3, 2, 0, -2, -3]
spread_bounds = [0.10, 0.03, 0.0, -0.03]             # ROIC − WACC
spread_points = [3, 2, 1, -1, -3]
# F8 · E9 (auditoría del 26-oct): el diferencial ROIC − WACC manda: [límite, tope]. Por debajo de 0, Rentabilidad no pasa
# de 10/20; por debajo de −3 pp, de 6/20.
spread_caps = [[0.0, 10.0], [-0.03, 6.0]]
# Márgenes frente a su industria de Damodaran, en puntos porcentuales (margen − agregado de la industria; ajuste del
# PM: una ratio se amplifica con márgenes de industria pequeños). Tramos de los cuantiles de 69 casos (26 en vivo y
# 43 golden): operativo p80 +19 pp, p60 +8, p40 +3, p20 −1; neto p80 +20, p60 +7, p40 +3, p20 −1. El último tramo
# (por debajo del último límite, margen ≥ 0) y luego < 0. Sin el de la industria, las bandas absolutas.
operating_margin_vs_industry_pp = [0.15, 0.05, -0.02, -0.08]
net_margin_vs_industry_pp = [0.12, 0.04, -0.03]
# Regla M (etapa 9a): ROIC no significativo si el capital invertido (patrimonio +
# deuda − caja) es menor que esta fracción de los activos (la caja lo encoge).
roic_min_invested_capital_share = 0.10
# F14 · paso 8: el ROIC se calcula con el resultado operativo normalizado si difiere del publicado en más de esta
# fracción (los cargos no recurrentes no deciden si la empresa crea o destruye valor).
roic_normalized_min_gap = 0.10
# REIT (etapa 9a): rentabilidad sobre el FFO (beneficio neto + D&A).
# Fase 7 (decisión del usuario, F7_CALIBRACION §6): FFO / ACTIVOS TOTALES en lugar de FFO / patrimonio contable. El
# patrimonio contable de un REIT depende de cómo se financia y de lo amortizado (82% de la muestra en el tramo alto: no
# discriminaba; premiaba el apalancamiento y las recompras, AMT 46%). Tramos: quintiles de 24 REIT de EE. UU., 295
# empresa-año 2012–2025 (p80 8.9%, p60 7.2%, p40 6.1%, p20 5.1%; mediana 6.6% en el tramo neutro), redondeados.
reit_ffo_assets_bounds = [0.09, 0.07, 0.06, 0.05]    # FFO / activos totales
reit_ffo_assets_points = [6, 3, 0, -3, -6]
# FFO / ingresos: PROVISIONAL (fase 7: mediana 53.7% en el tramo contiguo al neutro; el tramo alto, 40%).
reit_ffo_margin_bounds = [0.60, 0.50, 0.40, 0.25]    # FFO / ingresos
reit_ffo_margin_points = [5, 3, 0, -3, -5]
# GROWTH_PRE_PROFIT (etapa 9a): márgenes de su fase. PROVISIONAL.
gpp_gross_margin_bounds = [0.75, 0.65, 0.50, 0.35]
gpp_gross_margin_points = [5, 3, 0, -3, -5]
# Margen operativo (nivel) de una pre-beneficio: ≥0 equilibrio / ≥−10% cerca / ≥−20% moderada / ≥−30% alta / peor.
gpp_operating_margin_bounds = [0.0, -0.10, -0.20, -0.30]
gpp_operating_margin_points = [5, 3, 0, -3, -5]
gpp_opm_change_bounds = [0.05, 0.02, 0.0, -0.03]     # mejora interanual del margen operativo (pp)
gpp_opm_change_points = [4, 2, 0, -2, -4]
gpp_fcf_margin_bounds = [0.20, 0.10, 0.0, -0.10]     # (FCF − SBC) / ingresos
gpp_fcf_margin_points = [5, 3, 0, -3, -5]

[score.valoracion]                  # score_valoracion
# DCF como componente de Valoración (etapa 8): upside del DCF frente al precio,
# con el aporte acotado por su fiabilidad: ±4 de 20 (alta), ±2 (media), 0 (baja).
# Bandas: >= +30% claramente barata; +10..+30 barata; ±10% en precio (el error
# de un DCF es al menos de ese orden); −10..−30 cara; < −30% claramente cara.
dcf_upside_bounds = [0.30, 0.10, -0.10, -0.30]
dcf_points_high = [4, 2, 0, -2, -4]
dcf_points_medium = [2, 1, 0, -1, -2]
reit_pffo_bounds = [12, 16, 20, 25] # REIT: P/FFO ≤ (en lugar de P/E y P/FCF); contrastada en la fase 7 (mediana 17.2x)
reit_pffo_points = [4, 2, 0, -2, -4]
# Etapa 11b: UTILITY, rentabilidad por dividendo ≥ (junto al P/E frente al sector; contrastada en la fase 7:
# mediana 3.4%, bien centrada).
utility_yield_bounds = [0.05, 0.04, 0.03, 0.02]
utility_yield_points = [4, 2, 0, -2, -4]
pe_value_mults = [0.7, 0.9, 1.1, 1.3]
pe_value_points = [5, 3, 0, -2, -4]
# Etapa 9a: bloques de múltiplos correlacionados (P/E, Forward P/E, P/FCF,
# EV/EBITDA, PEG; y en FINANCIAL, P/B y P/TBV frente a sus justificados). Su ajuste
# es el promedio de los ajustes normalizados de los miembros con dato y aplicables,
# escalado a un máximo que crece con el número de miembros: ±2 con 1, ±4 con 2,
# ±6 con 3 o más (un solo múltiplo no pesa como tres).
multiples_block = ["P/E", "Forward P/E", "P/FCF", "EV/EBITDA", "PEG"]
multiples_block_max_by_members = [2, 4, 6]
multiples_block_strong = 0.5        # |promedio normalizado| >= 0.5: severidad excellent / severe
# F10 · N4 (revisión del informe de NVIDIA): P/E, Forward P/E y PEG dividen el mismo precio por el mismo BPA (el de doce
# meses, el esperado o su crecimiento): un salto del BPA los mueve a la vez (NVDA: +1, +1, +1). En el bloque cuentan
# como UN voto, la media de los que tengan dato; el máximo del bloque sale de los votos, no de los múltiplos.
multiples_earnings_family = ["P/E", "Forward P/E", "PEG"]
forward_compression_bounds = [0.25, 0.12, 0.05]   # (P/E − forward P/E) / P/E ≥
forward_compression_points = [3, 2, 1]
# F12 · D2 (decisión del usuario, 5-nov-2026; F3 de la revisión de NFLX): el forward se compara con el BPA que puntúa
# (normalizado) y con el reportado. Si el crecimiento que implica frente a uno y otro difiere más de esto, la
# normalización y el consenso están en bases distintas: la compresión se enseña y no puntúa.
forward_basis_gap = 0.15
pfcf_value_bounds = [12, 18, 25, 35]
pfcf_value_points = [4, 2, 0, -2, -4]
ev_ebitda_value_mults = [0.7, 1.2, 1.5]           # tramos: ≤0.7× / ≤1× / ≤1.2× / ≤1.5× / resto
ev_ebitda_value_points = [4, 2, 0, -2, -4]
peg_bounds = [0.8, 1.2, 1.8, 2.5]
peg_points = [4, 2, 0, -2, -3]
# Etapa 6 — FINANCIAL: P/B y P/TBV frente al justificado por su retorno,
# (ROE − g) / (Ke − g) con Ke por CAPM y g = crecimiento terminal del DCF.
financial_pb_ratio_bounds = [0.7, 0.9, 1.1, 1.4]   # P/B ÷ P/B justificado ≤
financial_pb_points = [4, 2, 0, -2, -4]
# GROWTH_PRE_PROFIT: EV/Ventas y regla de 40 (crecimiento + margen FCF).
ev_sales_bounds = [5.0, 10.0, 15.0, 25.0]          # ≤
ev_sales_points = [4, 2, 0, -2, -4]
rule_of_40_bounds = [0.60, 0.40, 0.25, 0.10]       # ≥
rule_of_40_points = [4, 2, 0, -2, -4]

[score.calidad]                     # score_calidad_ganancias
fscore_points = [7, 4, 0, -4, -7]   # tramos de valuation.models.piotroski.bands
ocf_points = [3, -4]                # OCF > 0 / ≤ 0
ocf_below_ni_points = 0             # F14 · paso 9: OCF > 0 pero por debajo del beneficio neto (alerta del Piotroski)
fcf_points = [3, -4]                # FCF > 0 / ≤ 0
fcf_to_ni_bounds = [1.0, 0.7, 0.3]  # FCF / beneficio neto ≥
fcf_to_ni_points = [3, 1, 0, -2]
# Etapa 6 — FINANCIAL (Piotroski, OCF, FCF y FCF/BN no aplican):
financial_roe_std_bounds = [0.02, 0.04, 0.06]      # desviación del ROE anual ≤ (estabilidad)
financial_roe_std_points = [3, 1, -1, -3]
financial_efficiency_bounds = [0.55, 0.60, 0.65]   # gastos no financieros / ingresos ≤ (aprox.)
financial_efficiency_points = [3, 1, -1, -3]
financial_bv_growth_bounds = [0.08, 0.05, 0.0]     # CAGR 3 años del valor en libros tangible ≥
financial_bv_growth_points = [3, 1, -1, -3]
# REIT: dividendo cubierto por FFO (Piotroski y FCF/BN no aplican).
reit_ffo_payout_bounds = [0.75, 0.85, 0.95]        # dividendos / FFO ≤
reit_ffo_payout_points = [3, 1, -1, -3]

[score.crecimiento]                 # score_crecimiento
revenue_bounds = [0.20, 0.10, 0.03] # y luego ≥0 / <0
revenue_points = [5, 3, 1, -1, -4]
eps_bounds = [0.25, 0.12, 0.05]     # y luego ≥0 / <0
eps_points = [5, 3, 1, -1, -4]
fcf_bounds = [0.15, 0.05, -0.05]
fcf_points = [4, 2, 0, -3]
# Estancamiento: entre −2% y 0 un crecimiento se puntúa como plano (banda 0–x%), no
# como contracción, en TODAS las bandas de crecimiento con corte en 0 (ingresos, BPA,
# FFO/acción, calidad del crecimiento, tipo de empresa, valor en libros, alerta y PDF).
# Error de medición de agregados aproximados (FFO) de ese orden.
flat_tolerance = 0.02
# Etapa 6 — REIT: el crecimiento se mide POR ACCIÓN (FFO por acción; la emisión
# estructural infla el agregado). Etapa 9a: entra en el retorno total (abajo).
# Etapa 9a — REIT: Crecimiento mide el RETORNO TOTAL para el accionista =
# rentabilidad por dividendo + CAGR 3 años del FFO por acción (el REIT reparte
# casi todo su FFO: el retorno llega sobre todo por el dividendo). Bandas frente
# al coste del equity de un REIT (Ke ≈ 8–9% con la prima implícita): >= 10% lo
# supera con holgura; 7–10% lo iguala; 4–7% queda por debajo pero en positivo
# real; 0–4% débil; < 0 destruye valor. La rentabilidad por dividendo deja de
# puntuar en Valoración (no se cuenta dos veces).
reit_total_return_bounds = [0.10, 0.07, 0.04]   # y luego ≥0 / <0
reit_total_return_points = [5, 3, 1, -1, -4]
# Fase 3 (T5, §4): MATURE con rentabilidad por dividendo >= 4% -> retorno total (dividendo + CAGR de ingresos) con
# las bandas del REIT (frente al Ke: 10% / 7% / 4%).
mature_total_return_min_yield = 0.04

[score.total]                       # calculate_score_v2 (etapa 9a: ya no hay un score total único)
max = 100                           # escala de cada una de las dos puntuaciones

[score]
# Fase 4 (T2; mapa, efecto frontera): a 2 puntos o menos de un umbral de nivel se avisa de la frontera. 2 puntos son
# un ajuste de ±1 sobre 20 en una sola categoría reescalada (5 puntos) contraído por la confianza media (×0.75 ≈ 4)
# a la mitad: el orden de lo que mueven 10 pb de Rf en el DCF o un múltiplo en el borde de su banda.
border_points = 2

# Etapa 9a — dos puntuaciones 0–100 (spec fallo 6, cambio 4). Cada categoría parte
# de 10/20 (= 50: sin señales), así que 50 es el punto neutro de las dos escalas.
[score.quality]                     # Calidad del negocio
categories = ["Solidez Financiera", "Rentabilidad", "Calidad de Ganancias", "Crecimiento"]
# Bandas (≥): excelente >= 85; sólida 65–85 (claramente por encima del neutro); media 45–65 (alrededor del neutro,
# con fortalezas y debilidades); débil < 45 (por debajo del neutro).
# F8 · E11 (auditoría del 26-oct: 14 de 26 con 80 o más, «saturación»): «excelente» desde 85, el p75 de 68 casos
# (las 26 de la auditoría en vivo y los 42 golden con calidad, ya con E9 en pp y la contracción por confianza baja; ver
# tools/f8_quality_bands.py). Con 80, E9 y la contracción dejaban «excelente» en el 43 % (antes, 47 %): la banda alta
# seguía siendo la más poblada. Con 85, el 25 %. Solo cambia la etiqueta: el codo de la persistencia sigue en 80
# ([quality_persistence] knee).
bands = [85, 65, 45]
labels = ["excelente", "sólida", "media", "débil"]
# F8 · E11 (auditoría del 26-oct): con confianza baja la calidad se contrae hacia el neutro (×0.85); con media o alta,
# no (la convergencia de métodos es del precio).
neutral = 50
confidence_factor = { baja = 0.85 }

[score.price]                       # Atractivo del precio (Valoración: múltiplos + DCF)
categories = ["Valoración"]
# Bandas (≥) sobre el valor CONTRAÍDO por la confianza: atractivo >= 65 (+3 netos
# sobre 20 o más: múltiplos por debajo del sector y/o DCF con margen); razonable
# 45–65 (en línea con el sector, ±); exigente 30–45; muy exigente < 30 (Valoración
# <= 6/20: casi todos los múltiplos en prima). Con confianza baja (factor 0.5) el
# precio no puede salir de [25, 75]: no llega a "muy exigente" ni a lo más alto.
bands = [65, 45, 30]
labels = ["atractivo", "razonable", "exigente", "muy exigente"]
neutral = 50
# Contracción hacia el neutro según la confianza del veredicto de valoración:
# precio_mostrado = 50 + (precio − 50) × factor.
confidence_factor = { alta = 1.0, media = 0.75, baja = 0.5 }
# F13 · paso 8 (revisión de 110 empresas, patrón 11b): sin veredicto de precio cuando el precio no es de hoy. La
# cotización lleva más de `abstain_stale_days` sin sesiones frente al mercado (EA: último precio el 4-ago-2026, 93 días
# antes; WBD, 31: operaciones corporativas), o no hay perfil ni `abstain_min_sessions` sesiones de historial.
abstain_stale_days = 10
abstain_min_sessions = 20

[alerts]
max_per_group = 6
years_ebitda_plural_from = 1.5      # "~2 años" vs "~1 año"

[alerts.pe]
# F10 · B3: con referencia, la lectura del P/E, del EV/EBITDA, del ROE y de los márgenes es la de su fila (bandas de
# thresholds.pdf.vs_sector_bounds, lib/vs_reference.py); sin referencia, solo los umbrales absolutos de abajo.
premium_abs = 35                    # sin referencia: P/E > 35x
justify_peg_max = 1.5               # prima justificada si PEG < 1.5 o spread > 5%
justify_spread_min = 0.05
strong_abs = 50                     # sin referencia: sobrevaloración fuerte, P/E > 50x
w_loss = 60
w_demanding = 62
w_overvalued = 68
w_premium = 48
w_discount = 40

[alerts.ev_ebitda]
high_abs = 25
w_high = 44
w_premium = 38
w_discount = 34

[alerts.fcf_yield]                  # umbrales: ThresholdConfig.fcf_yield_low/high
w_low = 42
w_high = 46

[alerts.peg]
artifact_above = 5                  # PEG > 5: artefacto, se descarta
attractive_below = 1.0
high_above = 2.0
w_attractive = 36
w_high = 34

[alerts.dcf]                        # umbrales del upside: los del score (score.valoracion.dcf_upside_bounds)
w_undervalued = 52
w_below_fair = 40
w_overvalued = 58
w_premium = 40

[alerts.credit_risk]                # F9 · R6: banco sin el riesgo de crédito medido (lib/credit_risk.py)
w_not_measured = 50

[alerts.roe]
negative_equity_min_roa = 0.03
min_equity_to_assets = 0.05         # F13 · 5c: ni fortaleza ni aviso con un patrimonio ínfimo
exceptional = 0.40
w_buyback_negative = 30
w_negative = 55
w_exceptional = 44
w_high = 44
w_low = 40
# F10 · N6 (revisión de NVDA: «amplificado por recompras» con un apalancamiento DuPont de 1.31): el ROE solo se dice
# amplificado por un patrimonio reducido si el apalancamiento DuPont (activos / patrimonio, último ejercicio) llega a
# este valor (patrimonio por debajo del 29 % de los activos). Mediana de los golden 2.6; los ROE excepcionales por
# margen (NVDA 1.31, MU 1.53, ASML 2.58, V 2.63, NVO 2.80) quedan por debajo y los apalancados (AAPL 4.87, CAT 4.62,
