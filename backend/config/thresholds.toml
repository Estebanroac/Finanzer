# ── Lecturas del PDF (pdf_report.read_*, score_band, grid) ──
# Bandas propias del informe, distintas de las del motor (ver el informe de
# conflictos de la etapa 4). Las etiquetas siguen en el código.
[pdf]                               # solo métricas que el score NO puntúa (etapa 9a: las demás
                                    # lecturas usan las bandas del score, una sola fuente por métrica)
vs_sector_bounds = [35, 10]         # % de brecha vs mediana: ±35 / ±10
pe_spread_support = 0.05            # prima de P/E "respaldada" si spread > 5%
payout_bounds = [0.40, 0.60, 0.80, 1]
graham_discount = 0.20
beta_market_upper = 1.2            # beta "de mercado" hasta 1.2; defensiva y muy volátil: beta_low / beta_high del sector
pos52_bounds = [10, 25, 70, 88]     # % del rango de 52 semanas (curva en U); también define la barra
buyback_bounds = [0.03, 0.005]      # ≥3% / ≥0.5% / > −0.5% / dilución
fcf_yield_bounds = [0.03, 0.05, 0.08]
grid_color_bounds = [30, 10]        # color de celda del grid: ±30 / ±10 % vs precio
eps_revenue_gap = 0.02              # BPA vs ingresos (informativo): "en línea" dentro de ±2 pp
category_tone_bounds = [60, 40]     # tono de una categoría (puntos/máximo, %): ≥60 pos / ≥40 warn / neg
exec_category_bounds = [13, 10]     # resumen ejecutivo: "destaca" si ≥13/20; "punto débil" si <10/20

# ── ROCE (etapa 6): contraste con el ROIC en MATURE y CYCLICAL ──
[roce]
divergence_pp = 0.10                # |ROCE − ROIC| > 10 pp -> se marca con sus causas probables
excess_cash_share = 0.15            # caja / activos totales ≥ 15% -> "caja excedente" como causa probable

# ── Normalización de ganancias (etapa 7, lib/normalize.py) ──
[dcf_reliability]                   # fiabilidad del DCF (lib/valuation_confidence.py, etapa 8)
terminal_max_pct = 85               # valor terminal > 85% del valor -> baja (el aviso sigue en 75%)
central_block = 1                   # "celda central ±1": bloque 3×3 alrededor del caso base
fcf_fields = ["freeCashflow", "free_cash_flow", "key_metrics.free_cash_flow"]
inferred_sources = ["finnhub", "derivado"]      # FCF que no viene de los estados -> inferido

[confidence]                        # confianza del veredicto (spec Sección 3; etapa 8: se muestra, no limita)
level_values = [1.0, 0.5, 0.0]      # alta / media / baja
overall_bounds = [0.75, 0.45]       # media ponderada >= 0.75 alta; >= 0.45 media; resto baja
upside_scale = 0.5                  # un upside de ±50% equivale a la señal ±1
neutral_band = 0.2                  # |señal| <= 0.2 (±10% de upside): "en precio", la misma banda que el DCF en Valoración
# Distancia máxima entre señales para "alta": 0.6 = 30 pp de upside, la distancia entre "en precio"
# y "claramente barata/cara" de las bandas del DCF. Si dos métodos difieren más que eso, coinciden
# en dirección pero no en magnitud (media). Los múltiplos dan una señal de bandas, no un upside:
# la escala es común solo de forma aproximada.
convergence_spread_max = 0.6
no_evaluable_cap = "media"          # techo de la confianza si la convergencia es media (fase 3: no evaluable ya no pone techo, opción 3 de §7.17)
no_official_source_cap = "baja"     # fase 2b (D7): techo de la confianza de un emisor sin estados en la SEC (F2_PRECEDENCIA §4)
weak_dimension_cap = "media"        # fase 4 (T2): techo si cobertura, fuente o estabilidad es baja (alta exige ninguna debilidad)
# Fase 4 (T2): acciones de la validación que no son incidencias del dato usado: "aviso" (el análisis usa su propio
# dato), "politica" (regla del arquetipo) y "sin_dato" (dato de otro periodo descartado o métrica no significativa: lo
# mide la cobertura). Cuentan los datos rechazados o corregidos ("invalido", …).
source_ignored_actions = ["aviso", "politica", "sin_dato"]
coverage_bounds = [0.9, 0.7]        # componentes evaluados / aplicables: >= 0.9 alta; >= 0.7 media
source_issue_bounds = [0, 2]        # incidencias de fuente: 0 alta; <= 2 media; más, baja
excluded_multiple_components = ["DCF", "Regla de 40"]   # no son múltiplos frente al sector

[confidence.weights]
convergence = 0.4
coverage = 0.2
source = 0.2
stability = 0.2

[normalization]
one_off_pct = 0.10                  # |no recurrentes netos| / beneficio neto > 10% -> P/E reportado no fiable
label_min_diff = 0.001              # etapa 9a: etiqueta "normalizado" solo si difiere del reportado > 0.1%
robust_z = 3.5                      # pico no operativo: |z robusto (mediana, MAD)| > 3.5 (Iglewicz-Hoaglin)
min_quarters = 4                    # trimestres con resultado no operativo necesarios para inferir picos
min_share_of_pretax = 0.03          # y el exceso debe ser >= 3% del beneficio antes de impuestos TTM
mad_floor_share_of_pretax = 0.01    # suelo de la escala (MAD): 1% del beneficio antes de impuestos trimestral medio
tax_rate_bounds = [0.0, 0.35]       # tipo efectivo TTM acotado
default_tax_rate = 0.21             # sin tipo efectivo calculable
# Recurrencia: mismo tipo y signo en >= 3 de los últimos 4 ejercicios -> solo el exceso sobre su promedio.
recurrence_min_years = 3
recurrence_window = 4
# Los componentes (cargos especiales + ganancias por venta) se usan como tipos si cuadran con el total.
components_tolerance = 0.05         # relativo al total
components_tolerance_abs = 1000000.0

# ── Crecimiento (etapa 7) ──
[growth]
per_share_min_shares_cagr = 0.02   # acciones +2% anual compuesto en la ventana -> crecimiento por acción
anomalous_base_ratio = 0.5          # año inicial < 0.5 × mediana de los demás -> regresión log-lineal
perimeter_min_years = 2             # fase 3 (T5): años homogéneos mínimos tras un cambio de perímetro; menos: no comparable

# ── Fase 3 (T6): lecturas de calidad que informan y no puntúan (lib/quality_readings.py) ──
[quality_readings]
fcf_margin_trend_pp = 0.02          # cambio del margen FCF − SBC entre el primer y el último ejercicio: mejora / empeora
rule_of_40 = 0.40                   # listón de la regla de 40 (crecimiento + margen FCF − SBC)
sbc_material = 0.05                 # SBC > 5% de los ingresos: se lee como coste real (F3_DISENO §5)
coverage_trend_rel = 0.20           # cobertura con el EBIT de cada ejercicio: ±20% entre extremos -> mejora / empeora

[premortem]                         # fase 4 (T3, PLAN §4.3; lib/premortem.py): "Esta lectura sería errónea si…"
margin_gap_rel = 0.20               # margen operativo de hoy > 120% del de referencia: la lectura depende de que se mantenga
margin_years = 10                   # mediana del margen de los últimos 10 ejercicios de EDGAR (un ciclo largo)
min_margin_years = 5                # con menos, sin referencia (no se afirma una media)
max_items = 3

[quality_persistence]               # fase 4 (T1, PLAN §4.1; lib/persistence.py): lo extraordinario exige persistencia
# La calidad por encima de "excelente" (la primera banda de score.quality) cuenta en proporción a la persistencia de
# las categorías que la llevan ahí: "excelente" no cambia y lo que está por encima (lo extraordinario) exige historia.
window = 5                          # ejercicios: un ciclo económico corto y el horizonte habitual del análisis de calidad
margin_ratio = 0.75                 # el margen de cada ejercicio, al menos el 75% del actual (el de hoy no es un pico)

