central_dispersion_max = 2.5        # (2) bloque central (g ± 2,5 pp, WACC ± 1 pp): máximo ÷ mínimo > 2,5: −1
fcf_margin_years = 5                # (3) margen FCF de los 5 últimos ejercicios (EDGAR)...
fcf_margin_cv_max = 0.33            #     ...con una desviación típica mayor que un tercio de su media: −1
# (5) PM, 27-oct: crecimiento proyectado (g ≥ 0) con el margen en caída. Margen TTM por debajo de la mediana de 5
# ejercicios en ≥ 20 % y ≥ 3 bajadas en los 4 últimos cambios: −1; caída ≥ 40 % (el doble): baja. Calibrado con las 26
# de la auditoría y los 43 golden: solo salta UNH (−42 %); el siguiente con 3 bajadas y g ≥ 0 cae un 6 % (XOM).
margin_trend_years = 5
margin_drop_min = 0.20
margin_drop_downs = 3
margin_drop_low_mult = 2.0       # caída ≥ 2 × margin_drop_min: baja directamente
# (6) F13 · paso 11 (opción c del usuario): ventas y BPA a 3 años separados más de esto: −1
growth_divergence_pp = 0.10
growth_divergence_low_mult = 2.0    # F14 · paso 10: más del doble de growth_divergence_pp -> fiabilidad baja
