# F12 · D1 (decisión del usuario, 5-nov-2026): el peso crece con la caída medida en la volatilidad anual realizada de
# la propia acción (z = |caída| / volatilidad): w con z ≤ z_low, w_max con z ≥ z_high, lineal entre medias. Una caída del
# −55 % en una acción que se mueve un 80 % al año (CIEN) es menos anómala que la misma en una que se mueve un 40 %.
# w_max no pasa del menor peso de las advertencias de solidez financiera (liquidez y runway ajustados, 44): la caída
# nunca saca del grupo a una de solvencia (con empate, el orden de los interpretadores la deja detrás). Los riesgos
# graves de solvencia (Altman, quema de caja, cobertura crítica) son banderas rojas: otro grupo, con su propio tope.
