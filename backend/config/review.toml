# Fase 7 (PLAN_FIABILIDAD §4, punto 2; RECON §7.13): revisión mensual de los parámetros de mercado, con su fuente y su
# fecha legibles por programa. La herramienta `tests/revision_parametros.py` dice cuáles toca revisar (edad frente a
# su cadencia) y el test `tests/test_revision_parametros.py` exige que cada uno tenga fuente y fechas y que los pares
# (Rf y prima de riesgo) vayan con la misma fecha. Actualizar un parámetro = cambiar su valor en su archivo Y su fila
# aquí (consulted y published), en el mismo commit.
#
# Campos: key (ruta de cfg), source, url, published (fecha del dato en la fuente, "" si no la da), consulted (cuándo se
# leyó; "" = sin fuente), cadence_days (cada cuánto se revisa), pair (otra fila que debe ir con la misma fecha, "" si
# ninguna), note.

[parameters.market_risk_premium]
key = "valuation.capm.market_risk_premium"
source = "A. Damodaran, Implied ERP (trailing 12 months, adjusted payout), NYU Stern"
url = "https://pages.stern.nyu.edu/~adamodar/"
published = "2026-10-01"
consulted = "2026-10-12"
cadence_days = 31
pair = "risk_free_rate"
note = "Damodaran la publica el día 1 de cada mes"

[parameters.risk_free_rate]
