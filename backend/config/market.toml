# Preparación de las fases 2b y 5 (PLAN_FIABILIDAD §2.2): serie diaria de precios, beta propia y señales
# técnicas. Módulos AISLADOS (lib/price_series.py, lib/market_signals.py): no entran en el motor, el score,
# la web ni el PDF. Las señales son contexto, nunca puntuación (PLAN §2.3).

[price_series]                  # lib/price_series.py
# 5 años: cubren el drawdown de 3 años (756 sesiones) y la beta de 2 años (104 semanas) con margen.
period = "5y"
interval = "1d"
# Mercado de referencia de la beta (perspectiva del inversor en dólares). Si el índice falla, el ETF que lo
# replica, declarado en la salida (`market_fallback`).
market_symbol = "^GSPC"
market_fallback_symbol = "SPY"
max_attempts = 3                # intentos por serie (1 + 2 reintentos)
retry_pause_s = 2.0             # pausa antes del reintento k: retry_pause_s × k (respeto a Yahoo)
# Huecos: sesiones en que cotizó el mercado (calendario del índice) y la serie no, desde su primera fecha.
# Con 0, un solo día sin cotización marca la serie como "sospechosa" (con las fechas).
max_missing_days = 0
# Salto en un día: max(p1/p0, p0/p1) − 1 > umbral → posible split sin ajustar (un 2:1 da 1.0; con 0.8 se
# marca una caída ≥ 44% o una subida ≥ 80%). Con 0.5 (lectura simétrica del "50%" del prompt) se marcaba la
# caída real de NFLX del 2022-04-20 (−35.1%, magnitud 0.54, la mayor de los 36); y un "50%" no simétrico no
# detecta un 2:1 (−50% exacto, menos si ese día sube).
jump_threshold = 0.8
# Eventos de split que declara Yahoo (ya aplicados al cierre ajustado): un ratio que no es una fracción simple
# (p/q con q ≤ spin_off_max_denominator, a spin_off_ratio_tol) es una posible escisión registrada como split
# (UL, Magnum, 2025-12-09: 0.888). No bloquea señales: la beta y el drawdown cuya ventana la contiene llevan
# una nota (decisión del usuario, 2026-10-15; se revisa en la fase 5).
spin_off_max_denominator = 10
spin_off_ratio_tol = 1e-6

[signals]                       # lib/market_signals.py
sessions_per_year = 252         # convención de sesiones bursátiles de EE. UU.

[signals.momentum]              # Jegadeesh y Titman (1993): 12 meses excluyendo el último
lookback_sessions = 252
skip_sessions = 21

[signals.trend]                 # Faber (2007): media de 200 sesiones
sma_sessions = 200
slope_sessions = 21             # pendiente: variación de la media en un mes de sesiones

[signals.volatility]
window_sessions = 252           # 1 año de rentabilidades diarias (logarítmicas)

[signals.drawdown]
windows_years = [1, 3]

[signals.relative_strength]     # frente al ETF del sector: 6 y 12 meses
# F8 · P3 (auditoría externa): una sola ventana para la web, el PDF y esta señal. Los periodos son los de la tabla de
# rentabilidades ([price_returns], lib/price_returns): días naturales desde la última sesión de la empresa y cierre
# ajustado (con dividendos). Antes, 126 y 252 sesiones comunes: MSFT daba +2,9 % frente al +30,0 % de XLK en la señal y
# +1,0 % frente al +27,4 % en la tabla, las dos a «12 meses».
windows = ["6M", "1A"]

[signals.volume]                # Gervais, Kaniel y Mingelgrin (2001)
recent_sessions = 5
baseline_sessions = 90          # sesiones de referencia ANTERIORES a las recientes (sin solaparse)

[signals.range52]
window_sessions = 252           # 52 semanas, incluida la sesión de hoy (criterio de la fase 1)

[signals.beta]                  # Práctica estándar (Bloomberg): 2 años semanales, MCO; Blume en valuation.capm
frequency = "W-FRI"             # cierre ajustado del viernes (o última sesión de la semana)
window_weeks = 104
min_weeks = 52

# ── Fase 2b: la serie de precios entra en el análisis (lib/price_history.py), solo para lo que permite D5 ──
# Una descarga diaria SIN ajustar (cierre, máximo y mínimo reales; cierre ajustado aparte) con los dividendos y
# splits declarados: de ella salen el dividendo indicado de los ADR (T2), el rango de 52 semanas (T6) y la beta
# propia (T6). 2 años bastan para la beta (104 semanas) y el rango (252 sesiones) y cubren dos ciclos de dividendo.

[beta_choice]                   # lib/beta.py (fase 2b, T6; F2_PRECEDENCIA §5): qué beta usa el motor
# F8 · E1 (auditoría externa del 26-oct-2026): la beta propia solo entra si pasa los TRES filtros; si no, se descarta
# (el informe lo declara) y se usa la de abajo hacia arriba (lib/beta.py). Antes: R² ≥ 0,10 y sin más filtros (AWK
# entraba con β −0,44 y R² 0,11).
min_r2 = 0.20                   # R² menor: la regresión no explica el título
# Error estándar de la pendiente: con 2 × EE ≤ 0,5, el intervalo del 95 % no es más ancho que el umbral de
# discrepancia entre fuentes (abajo); un EE mayor deja la beta indeterminada para el Ke.
max_se = 0.25
own_range = [0.4, 2.5]          # beta propia (bruta) fuera de este rango: no se usa
# Reapalancar exige una estructura de capital comparable a la de la industria: con una D/E de mercado más de
# `relever_max_de_ratio` veces la media de su industria (Damodaran), la deuda no es la del negocio (TM: 1,20 frente a
# 0,20, con la de su financiera cautiva) y se usa la beta media apalancada de la industria, declarado. En el panel, el
# resto de empresas queda por debajo de 1,8 veces.
relever_max_de_ratio = 3.0
discrepancy = 0.5               # |propia − fuente| mayor: aviso "beta discrepante entre fuentes" (la confianza lo registra)
# Rango de 52 semanas del motor (lib/beta.py): sesiones de los últimos `range52_window_days` días, sin el mismo día de
# hace un año (la definición de Yahoo: coincide con su mínimo en 35 de 35 tickers del panel; 252 sesiones, en 30).
range52_window_days = 365
# F9 · R2b (decisión del PM del 27-oct): la beta de abajo hacia arriba sale de la tabla de Damodaran de la región donde
# opera la empresa (config/betas_regional.toml), con la misma exposición que la prima de riesgo país
# (lib/country_risk.py): emergentes si la sede operativa o más de `region_majority` de los ingresos identificados
# (países y regiones con nombre) están en emergentes; si no, Europa con la misma regla; si no, EE. UU. (betas.toml).
# Antes: siempre la de EE. UU. (NU, banco brasileño: Banks (Regional) de EE. UU., 0,40; la de emergentes es 0,60).
region_majority = 0.50
# Región de Damodaran del país (country_risk.toml [country_region]) o región con nombre de la geografía -> grupo.
# «Asia» y «EMEA» mezclan desarrollados y emergentes: no cuentan para ningún grupo.
europe_regions = ["Western Europe", "Europe"]
emerging_regions = ["Africa", "Caribbean", "Central and South America", "Eastern Europe & Russia", "Eastern Europe",
                    "Middle East", "Africa & Mid East", "Latin America & Caribbean", "Emerging Markets",
                    "Small Asia (No India, China & Japan)"]
# Países de la región «Asia» de Damodaran que son emergentes (el resto de esa región, Japón, Singapur, Hong Kong,
# Australia…, no cuenta como emergente).
emerging_asia = ["China", "India", "Indonesia", "Malaysia", "Philippines", "Thailand", "Vietnam", "Pakistan",
                 "Bangladesh", "Sri Lanka", "Korea", "Taiwan"]

[history]
cache_max = 64                  # verificación de la v4 (V4): series del motor en caché como mucho (48 empresas, índices y ETF; antes sin tope)
period = "2y"
interval = "1d"
max_attempts = 2                # en el camino del análisis: un reintento corto, nunca bloquea el análisis
retry_pause_s = 0.5
cache_ttl_s = 300               # empresa: el mismo TTL que los datos del ticker (data.yahoo.cache_ttl_s)
market_cache_ttl_s = 21600      # S&P 500: 6 h por proceso (la beta usa semanas cerradas)
wait_timeout_s = 20.0           # espera máxima al hilo de la descarga antes de seguir sin la serie
years_v2 = 10                   # rediseño E2a (T5): ejercicios de la historia financiera de /v2 (lib/history_10y.py; EDGAR)
fy_gap_tolerance_days = 30      # E2a: el ejercicio anterior cierra a 1 año ± 30 días; si no, hay un hueco (sin crecimiento)
fy_year_shift_days = 7          # V4b: un ejercicio de 52/53 semanas que cierra en los primeros 7 días de enero es del año anterior (JNJ)
chart_period = "5y"              # rediseño E2a (T9): serie de la gráfica de /v2 (price_history.chart); el motor sigue con `period`
chart_cache_ttl_s = 21600       # 6 h por símbolo (la gráfica es diaria)
chart_cache_max = 32            # símbolos en la caché de la gráfica (Render: 512 MB; una serie de 5 años son ~1 250 filas)
chart_concurrency = 2           # V6 (B8): descargas de la gráfica a la vez (una por símbolo; las demás esperan)
chart_fail_ttl_s = 60           # V6 (B8): un símbolo sin serie no se vuelve a pedir en 60 s
market_total_return_symbol = "SPY"   # V7 (M7): el S&P 500 (^GSPC) no reparte dividendos; su rentabilidad total sale del
                                     # cierre ajustado del ETF que lo replica (o "^SP500TR", el índice de rentabilidad total)

# Fase 2b (T2): dividendo indicado en la moneda y la clase del precio, desde los pagos del propio título
# (F2_PRECEDENCIA §2.2). Frecuencia por la mediana de los intervalos entre pagos (días).
[dividends]
monthly_max_gap_days = 45
quarterly_max_gap_days = 135
semiannual_max_gap_days = 270
# Extraordinario: un pago mayor que `extraordinary_multiple` veces la mediana de los demás del periodo y SIN un
# pago comparable (≥ su mitad) un año antes (±`seasonal_window_days`): así el dividendo final mayor que los
# trimestrales (HSBC, ASML) o el semestral desigual (NVO, BCS) son ordinarios y el anual variable de PGR no.
extraordinary_multiple = 3.0
seasonal_min_ratio = 0.5
seasonal_lag_days = 365
seasonal_window_days = 60
level_tolerance = 0.02          # dos pagos "iguales" (cambio de nivel: subida o recorte)
stale_gap_multiple = 1.5        # el último pago es más antiguo que 1.5 intervalos + el periodo: historial incompleto
lookback_days = 760             # pagos que se miran (2 años y un margen)
source_tolerance = 0.25         # |indicado de la fuente / indicado de los pagos − 1| aceptable (subida declarada y aún no pagada)
downward_ratio = 0.5           # indicado < la mitad de lo cobrado en 12 meses: extraordinario o recorte (§2.2.4)
paid_band = [0.5, 2.0]          # pagado por título en los estados (TTM) frente a lo cobrado por título: fuera, aviso

# ── Fase 5: contexto de mercado y lectura conductual en el análisis (lib/market_context.py; D5: no puntúa) ──
[context]
drawdown_years = [1]                # la serie del análisis es de 2 años: la caída de toda la serie se calcula aparte
tolerated_missing_days = 5          # sesiones sueltas sin cotización toleradas (festivos de un ADR); un salto sigue bloqueando
momentum_band = 0.10                # |momentum 12-1| < 10%: "apenas ha movido la acción" (ni premio ni castigo)
relative_band = 0.10                # |empresa − ETF| ≥ 10 pp en 12 meses: el movimiento es propio de la empresa
volume_z = 2.0                      # z ≥ 2 (dos desviaciones típicas): atención inusual (Gervais, Kaniel y Mingelgrin, 2001)
anchor_within = 0.05                # a menos del 5% del máximo de 52 semanas: el máximo actúa como ancla (George y Hwang, 2004)
overreaction_drop = 0.40            # ≥ 40% bajo el máximo de 2 años sin deterioro fundamental (De Bondt y Thaler, 1985: perdedores extremos)
extrapolation_own_ratio = 0.8       # lo que exige el precio está en línea con lo logrado (≥ 80% del crecimiento propio)
news_days = 7                       # PLAN §4 (fase 5): titulares de 7 días si Finnhub company-news es gratuito (lo es)
news_max = 5                        # los 5 más recientes de la propia empresa, sin interpretar
news_max_v2 = 6                     # rediseño /v2 (E2a): 6 titulares (rejilla simétrica de 2 × 3); la web actual sigue con news_max
news_summary_chars = 280            # resumen de Finnhub recortado (en límite de palabra, con "…")
news_lang = "en"                    # /company-news de Finnhub publica medios en inglés: se indica el idioma original
# E2a (revisión del PM): un titular entra solo si el titular o el resumen nombran a la empresa: el ticker como palabra
# (de 2+ letras; uno de una letra solo como "(O)" o "NYSE: O") o su nombre corto (el legal sin los sufijos societarios
# de abajo), sin distinguir mayúsculas y por palabra completa. Finnhub pone el ticker en `related` de noticias generales.
news_name_suffixes = ["inc", "incorporated", "corp", "corporation", "co", "company", "plc", "nv", "sa", "se", "ag",
                      "ltd", "limited", "holdings", "holding", "group", "lp", "llc", "&", "the"]
# Palabras que, solas, darían falsos positivos: si la primera palabra del nombre corto es una de ellas, se exige el
# nombre corto completo ("Realty Income", no "Realty").
news_common_words = ["realty", "income", "energy", "general", "american", "united", "first", "national", "international",
                     "global", "capital", "financial", "bank", "health", "systems", "technologies", "industries",
                     "resources", "trust", "properties", "motors", "new", "royal", "great", "southern", "western",
                     "eastern", "northern", "central", "public", "digital", "applied", "advanced", "data"]
next_earnings_days = 120            # E2a: calendario de resultados de Finnhub hacia delante
estimate_cadence_days = 91          # E2a: sin fecha anunciada, último 8-K de resultados (2.02) + un trimestre, "estimada"
wait_timeout_s = 4.0                # espera máxima del ETF del sector y de los titulares (en paralelo; nunca bloquean el análisis)
sector_fail_ttl_s = 600.0             # un fallo del ETF del sector se recuerda 10 min (no se reintenta en cada análisis)
# PEAD (Bernard y Thomas, 1989): sorpresa del BPA (Finnhub) con la fecha del 8-K de resultados (SEC EDGAR, apartado 2.02)
pead_announce_max_days = 75         # el 8-K de resultados se presenta como mucho 75 días después del cierre del trimestre
pead_window_sessions = 60           # la deriva documentada dura unas 60 sesiones tras el anuncio
pead_inline = 0.02                  # |sorpresa| < 2% del consenso: "en línea con el consenso" (sin sorpresa que derive)
pead_min_sessions = 5               # con menos sesiones tras el anuncio no se juzga la deriva (aún no hay deriva que medir)
# F10 · N6 (revisión de NVDA): Finnhub fecha cada trimestre en el cierre del trimestre natural más cercano (NVDA:
# 2026-06-30 para el fiscal que cerró el 2026-07-26). El cierre real es el periodo del 10-Q o 10-K de EDGAR más cercano a
# esa fecha, como mucho a medio trimestre (46 días: ningún cierre fiscal queda más lejos de un cierre natural).
