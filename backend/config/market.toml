# Preparación de las fases 2b y 5 (PLAN_FIABILIDAD §2.2): serie diaria de precios, beta propia y señales
# técnicas. Módulos AISLADOS (lib/price_series.py, lib/market_signals.py): no entran en el motor, el score,
# la web ni el PDF. Las señales son contexto, nunca puntuación (PLAN §2.3).

[price_series]                  # lib/price_series.py
# 5 años: cubren el drawdown de 3 años (756 sesiones) y la beta de 2 años (104 semanas) con margen.
period = "5y"
interval = "1d"
# Mercado de referencia de la beta (perspectiva del inversor en dólares). Si el índice falla, el ETF que lo
# replica, declarado en la salida (`market_fallback`).
market_symbol = "^GSPC"
market_fallback_symbol = "SPY"
max_attempts = 3                # intentos por serie (1 + 2 reintentos)
retry_pause_s = 2.0             # pausa antes del reintento k: retry_pause_s × k (respeto a Yahoo)
# Huecos: sesiones en que cotizó el mercado (calendario del índice) y la serie no, desde su primera fecha.
# Con 0, un solo día sin cotización marca la serie como "sospechosa" (con las fechas).
max_missing_days = 0
# Salto en un día: max(p1/p0, p0/p1) − 1 > umbral → posible split sin ajustar (un 2:1 da 1.0; con 0.8 se
# marca una caída ≥ 44% o una subida ≥ 80%). Con 0.5 (lectura simétrica del "50%" del prompt) se marcaba la
# caída real de NFLX del 2022-04-20 (−35.1%, magnitud 0.54, la mayor de los 36); y un "50%" no simétrico no
# detecta un 2:1 (−50% exacto, menos si ese día sube).
jump_threshold = 0.8
# Eventos de split que declara Yahoo (ya aplicados al cierre ajustado): un ratio que no es una fracción simple
# (p/q con q ≤ spin_off_max_denominator, a spin_off_ratio_tol) es una posible escisión registrada como split
# (UL, Magnum, 2025-12-09: 0.888). No bloquea señales: la beta y el drawdown cuya ventana la contiene llevan
# una nota (decisión del usuario, 2026-10-15; se revisa en la fase 5).
spin_off_max_denominator = 10
spin_off_ratio_tol = 1e-6

[signals]                       # lib/market_signals.py
sessions_per_year = 252         # convención de sesiones bursátiles de EE. UU.

[signals.momentum]              # Jegadeesh y Titman (1993): 12 meses excluyendo el último
lookback_sessions = 252
skip_sessions = 21

[signals.trend]                 # Faber (2007): media de 200 sesiones
sma_sessions = 200
slope_sessions = 21             # pendiente: variación de la media en un mes de sesiones

[signals.volatility]
window_sessions = 252           # 1 año de rentabilidades diarias (logarítmicas)

[signals.drawdown]
windows_years = [1, 3]

[signals.relative_strength]     # frente al ETF del sector: 6 y 12 meses
windows_sessions = [126, 252]

[signals.volume]                # Gervais, Kaniel y Mingelgrin (2001)
recent_sessions = 5
baseline_sessions = 90          # sesiones de referencia ANTERIORES a las recientes (sin solaparse)

[signals.range52]
window_sessions = 252           # 52 semanas, incluida la sesión de hoy (criterio de la fase 1)

[signals.beta]                  # Práctica estándar (Bloomberg): 2 años semanales, MCO; Blume en valuation.capm
frequency = "W-FRI"             # cierre ajustado del viernes (o última sesión de la semana)
window_weeks = 104
min_weeks = 52

# ── Fase 2b: la serie de precios entra en el análisis (lib/price_history.py), solo para lo que permite D5 ──
# Una descarga diaria SIN ajustar (cierre, máximo y mínimo reales; cierre ajustado aparte) con los dividendos y
# splits declarados: de ella salen el dividendo indicado de los ADR (T2), el rango de 52 semanas (T6) y la beta
# propia (T6). 2 años bastan para la beta (104 semanas) y el rango (252 sesiones) y cubren dos ciclos de dividendo.

[beta_choice]                   # lib/beta.py (fase 2b, T6; F2_PRECEDENCIA §5): qué beta usa el motor
min_r2 = 0.1                    # beta propia con R² menor (o < min_weeks): la del sector (config/betas.toml)
discrepancy = 0.5               # |propia − fuente| mayor: aviso "beta discrepante entre fuentes" (la confianza lo registra)
# Rango de 52 semanas del motor (lib/beta.py): sesiones de los últimos `range52_window_days` días, sin el mismo día de
# hace un año (la definición de Yahoo: coincide con su mínimo en 35 de 35 tickers del panel; 252 sesiones, en 30).
range52_window_days = 365

[history]
period = "2y"
interval = "1d"
max_attempts = 2                # en el camino del análisis: un reintento corto, nunca bloquea el análisis
retry_pause_s = 0.5
cache_ttl_s = 300               # empresa: el mismo TTL que los datos del ticker (data.yahoo.cache_ttl_s)
market_cache_ttl_s = 21600      # S&P 500: 6 h por proceso (la beta usa semanas cerradas)
wait_timeout_s = 20.0           # espera máxima al hilo de la descarga antes de seguir sin la serie

# Fase 2b (T2): dividendo indicado en la moneda y la clase del precio, desde los pagos del propio título
# (F2_PRECEDENCIA §2.2). Frecuencia por la mediana de los intervalos entre pagos (días).
[dividends]
monthly_max_gap_days = 45
quarterly_max_gap_days = 135
semiannual_max_gap_days = 270
# Extraordinario: un pago mayor que `extraordinary_multiple` veces la mediana de los demás del periodo y SIN un
# pago comparable (≥ su mitad) un año antes (±`seasonal_window_days`): así el dividendo final mayor que los
# trimestrales (HSBC, ASML) o el semestral desigual (NVO, BCS) son ordinarios y el anual variable de PGR no.
extraordinary_multiple = 3.0
seasonal_min_ratio = 0.5
seasonal_lag_days = 365
seasonal_window_days = 60
level_tolerance = 0.02          # dos pagos "iguales" (cambio de nivel: subida o recorte)
stale_gap_multiple = 1.5        # el último pago es más antiguo que 1.5 intervalos + el periodo: historial incompleto
lookback_days = 760             # pagos que se miran (2 años y un margen)
source_tolerance = 0.25         # |indicado de la fuente / indicado de los pagos − 1| aceptable (subida declarada y aún no pagada)
downward_ratio = 0.5           # indicado < la mitad de lo cobrado en 12 meses: extraordinario o recorte (§2.2.4)
paid_band = [0.5, 2.0]          # pagado por título en los estados (TTM) frente a lo cobrado por título: fuera, aviso
