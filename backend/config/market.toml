[segments]                      # lib/segments.py: ingresos por segmento de la instancia XBRL del último 10-K/20-F/40-F
# Ejes por prioridad (nombre local; US GAAP e IFRS). El primero utilizable es el principal; el geográfico va a
# `secondary` si hay uno de los anteriores; el resto de ejes utilizables, a `others` (Apple: productos).
axes = ["StatementBusinessSegmentsAxis", "SegmentsAxis", "ProductOrServiceAxis", "ProductsAndServicesAxis"]
geographic_axes = ["StatementGeographicalAxis", "GeographicalAreasAxis"]
# V7 · P2 y P4 (segments.summary): el desglose por producto, si el emisor lo publica, abre el capítulo 2; la geografía
# (o el eje principal) va como segunda línea; como mucho estos segmentos por línea (el resto, en la página Negocio).
