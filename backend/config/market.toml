[price_returns]                  # lib/price_returns.py: rentabilidad por periodo y base 100 de /api/v2/prices (web y PDF)
# Periodos de la web (y del PDF): clave, rótulo y días naturales hacia atrás desde la última sesión de la empresa
# (0 = desde el 1 de enero: en lo que va de año). Revisión V6 (F1): los calcula el backend, no el navegador.
range_keys = ["1S", "1M", "3M", "6M", "YTD", "1A", "3A", "5A"]
range_labels = ["1 semana", "1 mes", "3 meses", "6 meses", "En lo que va de año", "1 año", "3 años", "5 años"]
range_days = [7, 30, 91, 182, 0, 365, 1095, 1825]
# Una serie cubre el periodo si empieza, como tarde, estos días después de su inicio; si no, sin dato ("—"),
# nunca la cifra de un periodo más corto.
cover_slack_days = 7
# Gráfica en base 100: el periodo se da por cubierto si la ventana común de las series dura al menos sus días
# menos estos (si no, la gráfica dice desde cuándo empieza).
chart_slack_days = 10
# Decimales de la base 100 en la respuesta (la gráfica no necesita más).
chart_decimals = 2

