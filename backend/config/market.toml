# P8: mini-gráficas del cintillo de la portada (lib/sparklines.py, GET /api/v2/sparklines). Barras de Yahoo (chart) por
# periodo: intervalo, rango y vida en caché. 1D: barras de 5 min de la última sesión y, como referencia, el cierre
# anterior (descarga diaria de 5 días); 1S/1M/6M: referencia, el primer cierre del periodo.
[sparklines]
