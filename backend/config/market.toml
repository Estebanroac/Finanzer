summary_items_max = 5
# Desde ASU 2023-07 el ingreso de cada segmento operativo lleva además ConsolidationItemsAxis = OperatingSegmentsMember
# (AAPL, JPM): ese miembro no cuenta como segunda dimensión. Cualquier otra combinación de dos ejes se ignora.
neutral_members = ["ConsolidationItemsAxis=OperatingSegmentsMember", "ConsolidationItemsAxis=ReportableSegmentsMember"]
# Eliminaciones entre segmentos de cada segmento (XOM): si el ingreso bruto de los segmentos no concilia con el
# consolidado, se prueba neto de ellas (ingreso de clientes externos) y se dice en `notes`.
elimination_members = ["ConsolidationItemsAxis=IntersegmentEliminationMember"]
# Un miembro de estos ejes que repite el miembro de otra dimensión del contexto no cuenta (NEE: el segmento FPL lleva
# además LegalEntityAxis = FPL, la misma empresa).
redundant_axes = ["LegalEntityAxis"]
# RegulatedAndUnregulatedOperatingRevenue: el ingreso de las eléctricas reguladas (NEE: FPL y NEER).
revenue_concepts = ["RevenueFromContractWithCustomerExcludingAssessedTax", "Revenues", "SalesRevenueNet",
                    "RevenuesNetOfInterestExpense", "RevenueFromContractWithCustomerIncludingAssessedTax",
                    "RegulatedAndUnregulatedOperatingRevenue",
                    "Revenue", "RevenueFromContractsWithCustomers"]   # los dos últimos: ifrs-full
# Cobertura: la suma de los segmentos del último ejercicio frente a los ingresos consolidados del emisor. El total, por
# orden: el primero de total_revenue_concepts sin dimensión en la instancia; si no, un total PROPIO del emisor de
# extension_total_concepts (los bancos NIIF no tienen elemento estándar de "total income": BCS lo publica como
# bcs:OperatingIncome, £29,1 bn) siempre que no sea menor que la suma de los segmentos (así no se toma el beneficio
# operativo de una empresa no financiera); si no, el `revenue` de companyfacts del mismo periodo.
total_revenue_concepts = ["Revenues", "RevenuesNetOfInterestExpense", "Revenue", "RegulatedAndUnregulatedOperatingRevenue",
                          "SalesRevenueNet", "RevenueFromContractWithCustomerExcludingAssessedTax",
                          "RevenueFromContractWithCustomerIncludingAssessedTax"]
extension_total_concepts = ["OperatingIncome", "TotalIncome", "TotalOperatingIncome", "TotalNetRevenue"]
# V2 (decisión del PM): una aseguradora (la rama de aseguradoras de FINANCIAL: industria «Insurance - …») que no desglosa
# ingresos por segmento desglosa primas (CB). Solo para ellas y solo si ningún concepto de revenue_concepts da segmentos;
# la cobertura se mide frente a los ingresos consolidados, como en BCS.
premium_concepts = ["PremiumsEarnedNet", "PremiumsEarnedNetPropertyAndCasualty", "PremiumsEarnedNetLife",
                    "PremiumsEarnedNetAccidentAndHealth", "InsuranceRevenue"]   # el último: ifrs-full (NIIF 17)
min_period_days = 350
reconcile_tolerance = 0.02
# Etiquetas que el emisor publica en mayúsculas ("UNITED STATES", "REST OF ASIA PACIFIC"): pasan a mayúscula inicial
# por palabra, salvo estas siglas (que se conservan) y estas palabras de enlace (en minúscula si no van primero).
upper_words = ["US", "USA", "UK", "EU", "EMEA", "APAC", "LATAM", "IT", "AI"]
lower_words = ["of", "and", "the", "de", "y", "del"]
acronym_max_len = 4          # una etiqueta de una sola palabra en mayúsculas y de hasta 4 letras se deja (FPL, NEER)
# Un miembro que es la suma de otros dos o más del mismo eje (Product = iPhone + Mac + iPad + Wearables) es un
# agregado y sale (si no, se contaría dos veces). La suma de un agregado es exacta salvo redondeo: tolerancia estrecha.
aggregate_tolerance = 0.001
# Miembros solapados (RIVN: Automotive = Vehicles + Regulatory Credits, y "Software and Services" dos veces): si la suma
# del eje supera el total consolidado más que reconcile_tolerance, se busca el subconjunto que concilia (exhaustivo
# hasta max_subset_members miembros): el de más miembros y, a igualdad, el de menos etiquetas casi duplicadas.
max_subset_members = 12
# Un eje con un miembro de más del 95 % no son segmentos sino componentes del ingreso (XOM: "Sales and other operating
# revenue" 97,5 %): se descarta y se dice en dropped_axes.
max_single_share = 0.95
segments_budget_s = 8.0      # endpoint perezoso: más margen que el análisis (3 s), sigue acotado
segments_ttl_s = 604800      # 7 días por filing (no cambia hasta el siguiente 10-K)
segments_cache_max = 64
segments_concurrency = 2     # V6 (B8): consultas de segmentos a la vez (una por símbolo; las demás esperan)
segments_fail_ttl_s = 60     # V6 (B8): sin dato (EDGAR caído, sin informe…), no se vuelve a consultar en 60 s
# La instancia se descarga en streaming a un archivo temporal y se lee en flujo: la memoria no depende de su tamaño
# (BCS: 44 MB). El tope solo protege el disco y el tiempo; el tamaño sale del índice (mayor: sin_dato sin descargar).
max_instance_mb = 150
# Rendimiento (v4f8): en cuanto el análisis tiene EDGAR (etapa 2), el último informe anual se descarga en segundo plano
# (índice, instancia a un archivo temporal y etiquetas, sin leerlos) mientras siguen Yahoo y Finnhub; la prima de riesgo
# país lo toma en vez de descargarlo. Mismos archivos de la SEC: mismo resultado. Una descarga que nadie toma se borra
# a los `prefetch_ttl_s`; como mucho `prefetch_max` guardadas a la vez.
prefetch_ttl_s = 120
prefetch_max = 8
prefetch_concurrency = 4     # una por análisis a la vez ([server] max_concurrent_analyses): solo red, sin lectura

[peers]                         # lib/peers.py: rivales analizados con el motor completo, en segundo plano
peers_count = 5
min_peers = 3
caps_ttl_s = 604800         # capitalizaciones de Finnhub: 7 días (solo ordenan por tamaño)
poll_s = 4                  # el cliente vuelve a preguntar cada 4 s mientras haya rivales en cola
# Capitalizaciones que se piden por empresa (los candidatos del universo primero): Finnhub gratuito admite 60/min y el
# análisis también lo usa, así que se piden con una pausa entre ellas. 20 × 1.5 s = 30 s la primera vez (7 días en caché).
max_cap_lookups = 20
finnhub_min_interval_s = 1.5
# PDF rápido: antes, las capitalizaciones de los candidatos, de Finnhub y de una en una (con la pausa de arriba): 16,7 s
# para HD (12) y 31 s para NVDA (20). Ahora, todas en una sola petición a Yahoo (v7/finance/quote: 0,1–0,5 s); Finnhub
# solo para las que Yahoo no trae en dólares.
yahoo_quote_url = "https://query1.finance.yahoo.com/v7/finance/quote"
yahoo_quote_timeout_s = 5.0
# Dentro de esta banda de tamaño (capitalización del rival entre 1/3 y 3 veces la de la empresa), primero los de su
# región de Damodaran y después el resto, por cercanía de tamaño (BCS: bancos europeos antes que NU o FITB).
size_band_low = 0.3333
size_band_high = 3.0
# V7 · P5: un P/E por encima de este valor (beneficio casi nulo: CRWD 4366x) no es significativo en la tabla de rivales
# ni en su resumen: sale «n. s.» con la cifra en la nota. 200x = rentabilidad por beneficio del 0,5 %.
pe_meaningful_max = 200.0
# V4b (auditoría de datos): columnas de la tabla de rivales que el resumen de cada empresa (analysis_queue.summary)
# rellena siempre: con la cifra de la página o, sin ella, con el motivo («No aplica», «n. s.») en la nota.
summary_columns = ["pe", "ev_ebitda", "roic", "net_margin", "revenue_growth", "de"]
# V6 (revisión de seguridad, B3/B10): un fallo pasajero (el análisis de la empresa no salió, o Finnhub no dio su
# capitalización) se recuerda solo `fail_ttl_s`, no los 7 días de un ranking o una capitalización buenos; y las cachés
# tienen tope (las de escritura más antigua salen primero).
fail_ttl_s = 600
caps_cache_max = 512        # capitalizaciones (20 candidatos por empresa)
rankings_cache_max = 64     # rankings automáticos (uno por empresa consultada)
# V2 (decisión del PM): en la lista automática, un rival cuyo análisis falla porque la fuente ya no tiene el símbolo
# (ACLX) se sustituye por el siguiente del ranking, como mucho estas veces; la nota lo dice. La lista elegida a mano no.
max_substitutions = 2
no_data_markers = ["No data found", "No hay datos"]
# F10 · N5 (revisión de NVDA, 28-oct-2026): el PDF salía sin rivales («aún no estaba listo»): solo se calculaban al
# abrir la página Rivales y tardan ≈ 30 s de capitalizaciones (20 × 1,5 s, la primera vez en 7 días) más un análisis
# por rival, de uno en uno (p50 110–135 s). Ahora empiezan cuando se sirve el análisis de la empresa a un usuario
# (prioridad `user`: antes que el precalentado de tendencias), sin subir el ritmo de Finnhub; y el PDF espera como mucho
# `pdf_wait_s` a los que estén en marcha (fuera de su turno de análisis: la cola sigue avanzando), mirando cada
# `pdf_poll_s`, y dice los que faltan y por qué. 30 s: el PDF no pasa del minuto aun con el análisis sin caché (el
# proxy corta a los 100 s).
start_with_analysis = true
pdf_wait_s = 30
pdf_poll_s = 1.0

[analysis_queue]                # lib/analysis_queue.py: cola de análisis en segundo plano (rivales y tendencias)
summary_ttl_s = 86400       # resumen de un análisis (rival o tarjeta de tendencias): 1 día
summary_cache_max = 64      # rivales de unas pocas empresas y las 30 tarjetas de tendencias (cada resumen ocupa pocos kB)
max_queue = 20              # trabajos de usuarios en cola como máximo (protege Render); por encima: "cola llena"
# PDF rápido: hilos de la cola. El primero toma todo; los demás, solo `user` (rivales): 5 rivales de HD, de uno en uno,
# eran 8,6 s. El precalentado de tendencias sigue de uno en uno. La memoria la acota el turno de análisis compartido con
# los usuarios (data.server.max_concurrent_analyses), no el número de hilos.
workers = 2
max_prewarm_queue = 30      # precalentado en cola como máximo (= [trending] prewarm_max)
fail_ttl_s = 600            # un análisis que falló se recuerda 10 min (no se reintenta en cada consulta)
busy_wait_s = 2.0           # con usuarios esperando turno de análisis, el hilo vuelve a mirar cada 2 s
max_per_client = 10         # V6 (B7): trabajos de un mismo cliente (IP) en cola: los rivales de dos empresas

[search]                        # lib/search_v2.py: buscador de /v2 (portada y barra general)
limit = 8                   # resultados como mucho (los mismos que /api/search)
yahoo_count = 10            # resultados que se piden a Yahoo (más que `limit`: dan la bolsa de los de la base local)
timeout_s = 5.0

[trending]                      # lib/trending.py: tendencias del día de la portada sobre el universo
top_n = 30                      # P8: el cintillo rota unos 30 valores por lista
batch_size = 100           # símbolos por descarga de Yahoo (lotes: menos peticiones)
min_price = 1.0            # excluye cotizaciones residuales
refresh_after_close_min = 30   # la sesión se da por cerrada 30 min después del cierre de NY (16:00 ET)
close_hour_et = 16             # cierre de la sesión regular de NY (hora de Nueva York)
retry_after_s = 600            # tras un cálculo fallido, no se reintenta antes de 10 min (respeto a Yahoo)
# Rediseño E4: tras calcular las listas, sus símbolos sin resumen en caché se analizan en la cola compartida con
# prioridad `prewarm` (de uno en uno y solo sin usuarios esperando), como mucho estos al día (Render gratuito).
prewarm_max = 30
# Cierre de la v4: por debajo del keep-alive de uvicorn (5 s). Con 5, la conexión se cerraba justo cuando el sondeo la
# reutilizaba y WebKit, que no reintenta, perdía la petición («The network connection was lost»; V3, yahoo_down).
poll_s = 4                     # la portada vuelve a preguntar cada 4 s mientras calcula o analiza tarjetas
# P8 (cintillo): listas por sector GICS de la misma descarga del universo (sin llamadas nuevas a Yahoo), con los
# `top_n` valores de más volumen en dólares; con menos de `min_sector_items` valores con cotización, el chip del sector
# sale deshabilitado con su motivo. Claves estables en inglés (GICS); la etiqueta en español, en sector_labels.
min_sector_items = 6
# P8b: las listas se calculan en el periodo elegido (el mismo de las mini-gráficas): variación con el cierre ajustado de
# hace N sesiones (lib/period_change.py) y volumen medio diario en dólares de esas N sesiones. La descarga diaria del
# universo cubre `history_days` días naturales: con period="6mo" Yahoo trae 126 o 127 sesiones según el valor, y la
# variación de 6M necesita 127 (la última y 126 antes).
periods = ["1D", "1S", "1M", "6M"]
history_days = 190
# Portada rápida: la última lista buena (y las mini-gráficas de la vista inicial) en disco, relativa a backend/. Tras un
# reinicio se sirve al momento mientras se recalcula. FINANZER_PORTADA_SNAPSHOT=0 la apaga; con otra ruta, esa (un
# disco persistente). En Render gratuito el disco se borra en cada arranque: allí solo ayuda dentro de un mismo arranque.
snapshot_file = ".cache/portada.json"
sectors = ["Information Technology", "Communication Services", "Consumer Discretionary", "Consumer Staples",
           "Health Care", "Financials", "Energy", "Industrials", "Materials", "Utilities", "Real Estate"]

[trending.period_sessions]       # sesiones hacia atrás de cada periodo (1D: la sesión anterior)
