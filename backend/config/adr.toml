# Fase 2b (T1): factor oficial de clase de las acciones que cotizan (lib/currency.py).
#
# Un ADR representa N acciones ordinarias; la clase B de BRK equivale a 1/1500 de la clase A. El factor sale del
# contrato de depósito (F-6 del banco depositario) y de la portada del 20-F ("Title of each class", 12(b)), no de
# XBRL. Verificado en EDGAR el 2026-10-15 (docs/fiabilidad/F2_EDGAR_DIAGNOSTICO.md §5).
#
# El factor IMPLÍCITO (acciones de los estados / acciones de la cotización) solo es una comprobación: entre la
# fecha del balance y la de la cotización se cuelan las recompras y emisiones (BCS 4.154 por las recompras de 2026;
# TM 11.07 por la recompra de ~1,200 millones de acciones a Toyota Industries en el 1T del FY2027, 6-K del
# 2026-08-04). Si difiere del oficial más de `implied_tolerance`, se anota con la cifra y el factor no se toca.

implied_tolerance = 0.02        # |implícito / oficial − 1| por encima del cual se anota el desfase

# Emisores fuera de la tabla (regla aprobada en el punto de parada 1 de la 2b, 2026-10-16):
#   B. el factor de la portada de su 20-F en EDGAR ("Title of 12(b) Security": "American Depositary Shares, each
#      representing N shares"; lib/sec_edgar.cover_factor);
#   A. si la portada no lo dice o EDGAR no responde: el implícito se ajusta a la fracción simple más cercana (n o 1/n)
#      si está a ≤ `inferred_tolerance`, declarado "factor inferido, sin verificar con el depositario"; si no, se
#      aplica el implícito tal cual con aviso.
inferred_tolerance = 0.02
inferred_max_ratio = 100        # candidatos: 1..100 acciones por título y 1/1..1/100

