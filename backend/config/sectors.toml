# ── Arquetipos (etapa 6, lib/classify.py) ──
# Una sola función decide el arquetipo; motor, alertas, PDF y frontend leen su
# salida. Prioridad: FINANCIAL > MATURE (excepción financiera) > REIT > UTILITY >
# GROWTH_PRE_PROFIT > CYCLICAL > GROWTH_PROFITABLE > MATURE (por defecto). Fase 3 (T2, D4): la ciclicidad se mide
# con la historia de EDGAR (≥ min_years ejercicios) antes que el crecimiento; sin ella, por industria con confianza baja.
# Las industrias se comparan normalizadas: minúsculas y "—", "–" o "-" entre
# palabras unificados como " - " (prod trae "Banks—Diversified"; local, "Banks - Diversified").
[archetypes]
financial_sectors = ["financial services", "financials"]
bank_prefixes = ["banks"]                        # FINANCIAL: bancos
insurance_prefixes = ["insurance - "]            # FINANCIAL: aseguradoras ("Insurance - Life", ...)
# MATURE dentro de Financial Services: sin balance de préstamos que sea el producto.
financial_mature_industries = ["asset management", "financial data & stock exchanges", "insurance brokers"]
# Credit Services mezcla redes de pago (V, MA) con prestamistas (COF, SYF, AXP):
# es MATURE solo si es de tipo red de pagos, medido por la intensidad de balance
# (activos totales / ingresos). Un prestamista lleva su cartera en el activo.
payment_network_industries = ["credit services"]
payment_network_max_assets_to_revenue = 3.0      # V 2.5x; AXP ~4x, SYF ~5.5x, COF ~12x
reit_prefixes = ["reit"]                         # "REIT - Retail", ...; promotoras y servicios NO
# Etapa 11b: UTILITY regulada (tarifa fijada por el regulador sobre una base de activos).
# Fuera: "utilities - independent power producers" (generación mercantil, precio de
# mercado: cíclica o madura según sus reglas) y "utilities - renewable" (mezcla
# promotores en crecimiento y yieldcos; sin regulación tarifaria común).
utility_industries = ["utilities - regulated electric", "utilities - regulated gas",
                      "utilities - regulated water", "utilities - diversified"]
growth_pre_profit_min_revenue_cagr = 0.15        # CAGR real de ingresos a 3 años (4 ejercicios)
# Industrias cíclicas SIEMPRE (nombres exactos de Yahoo, normalizados).
cyclical_industries = [
    "copper", "steel", "aluminum", "other industrial metals & mining",
    "gold", "silver", "other precious metals & mining", "coking coal", "thermal coal", "uranium",
    "oil & gas e&p", "oil & gas refining & marketing", "oil & gas integrated",
    "oil & gas drilling", "oil & gas equipment & services",
    "chemicals", "agricultural inputs",
    "semiconductor equipment & materials",
    "airlines", "auto manufacturers", "auto parts",
    "building materials", "residential construction", "real estate - development",
    "lumber & wood production", "paper & paper products", "marine shipping",
]
# Industrias cíclicas CONDICIONALES: mezclan negocios de ciclo (memoria, commodities
# químicos) con otros estructurales (diseño de chips, gases industriales). Solo son
# CYCLICAL si en la ventana de ejercicios hay REVERSIÓN ([archetypes.reversion]);
# si no, MATURE (con la alerta "posible cíclica" si la volatilidad es alta).
cyclical_conditional_industries = ["semiconductors", "specialty chemicals"]

# Regla de reversión (cíclicas condicionales): una caída pico-valle del margen
# operativo, o una caída anual de ingresos, dentro de la ventana disponible. Un
# crecimiento explosivo sin caídas (NVDA) no es un ciclo; una caída sí lo es (MU).
[archetypes.reversion]
op_margin_peak_to_trough = 0.10     # el margen cae > 10 pp desde un pico anterior
revenue_annual_decline = 0.10       # algún ejercicio con ingresos −10% o peor

# Regla de desviación SOLO como alerta ("posible cíclica"): no cambia el arquetipo
# (tampoco en las condicionales), baja la confianza. Con los ejercicios anuales (Yahoo: 4).
[archetypes.possible_cyclical]
min_years = 4                       # ejercicios con dato necesarios para evaluarla
op_margin_detrended_std = 0.05      # desviación del margen operativo alrededor de su tendencia lineal (5 pp)
revenue_growth_std = 0.15           # desviación del crecimiento interanual de ingresos (15 pp)

[archetypes.cyclicality]          # fase 3 (T2, D4; F3_DISENO_METODO §1.2): ciclicidad medida con la historia de EDGAR
# Propuesta de la T2 (F3_T2_PARADA2): las medidas del diseño confundían el ciclo con cargos puntuales y
# reestructuraciones; deciden los episodios repetidos de caída de ingresos y los desplomes del BPA con caída de
# ingresos. Cíclica si se cumple CUALQUIERA, con al menos `min_years` ejercicios (con menos, la regla de industria con
# confianza baja). Sensibilidad ±20% en F3_T2_PARADA2.
min_years = 8                     # ejercicios anuales en EDGAR para medir un ciclo
revenue_decline = 0.10            # caída interanual de ingresos que cuenta como episodio (los consecutivos, uno)
min_decline_episodes = 2          # episodios de caída: un ciclo se repite
eps_drop = 0.5                    # una caída del BPA de más de la mitad (o a negativo) es un desplome
min_eps_collapses = 2             # desplomes del BPA el mismo ejercicio en que caen los ingresos
discontinued_material_share = 0.10   # discontinuadas ≥ 10% del beneficio: cambio de perímetro, corta la serie
# Ruptura del capital: las acciones diluidas medias crecen ≥ 50% en un ejercicio (conversión de preferentes al salir a
# bolsa: PLTR 2020–21, SNOW, RIVN; fusión pagada en acciones: BAC 2009, PLD 2011). La serie POR ACCIÓN no es
# comparable a través de ella: se corta como un cambio de perímetro.
share_break = 0.50
# Apalancamiento operativo: un episodio de caída de ingresos es ciclo si el margen operativo cae al menos 2 puntos
# frente al ejercicio anterior al episodio (en el peor ejercicio del episodio). Una caída de ventas con el margen
# estable o al alza es perímetro o volumen sin apalancamiento (KO 2017, refranquicia: 20.7% → 21.4%). Sin margen
# en la historia (XOM, DOW, SHEL no presentan resultado operativo), el episodio cuenta y se declara.
margin_drop = 0.02
# Crecimiento de ciclo medio (fase 3, T5): de pico a pico (el ejercicio anterior a cada episodio confirmado), con al
# menos estos años entre el primer y el último pico (un ciclo completo).
min_cycle_years = 5

[archetypes.growth_profitable]    # fase 3 (T2, D4; F3_DISENO_METODO §1.3): crecimiento rentable (las tres a la vez)
min_revenue_ps_cagr_3y = 0.15     # CAGR de los ingresos por acción a 3 años
min_revenue_ps_cagr_5y = 0.10     # y a 5 años, si hay historia
min_operating_margin = 0.10       # margen operativo TTM (o margen FCF − SBC, la alternativa del diseño)

[archetypes.financial_subtypes]   # fase 3 (T2; F3_DISENO_METODO §1.4)
# Conglomerado: aseguradora cuyos ingresos de contratos con clientes (que por norma excluyen los contratos de seguro,
# ASC 606 / NIIF 15: son sus negocios no aseguradores) pesan al menos esto en los ingresos (BRK-B: 247 de 371 mil
# millones de USD en 2025, 67%; PGR: 0).
conglomerate_min_non_insurance_share = 0.5

# Componentes que NO APLICAN por arquetipo (no cuentan en la cobertura). Claves:
# piotroski, altman, ocf, fcf, fcf_to_ni, de, ev_ebitda, pe, peg, forward_pe, p_fcf,
# garp (bonos y rescates de crecimiento sobre múltiplos), current_ratio,
# interest_coverage, net_debt_ebitda, roic_wacc, operating_margin, fcf_growth,
# eps_growth, dcf, graham, roce.
[archetypes.not_applicable]
FINANCIAL = ["piotroski", "altman", "ocf", "fcf", "fcf_to_ni", "de", "ev_ebitda", "dcf", "graham",
             "pe", "peg", "forward_pe", "p_fcf", "garp", "current_ratio", "interest_coverage",
             "net_debt_ebitda", "roic_wacc", "operating_margin", "fcf_growth", "roce",
             "gross_margin"]   # etapa 9b: sin coste de ventas; margen bruto "No aplica", no "Sin dato"
REIT = ["altman", "piotroski", "fcf_to_ni", "garp", "pe", "peg", "forward_pe", "p_fcf", "dcf", "roce", "eps_growth",
        "current_ratio", "graham",
        # Etapa 9a: rentabilidad sobre FFO; los ratios sobre el beneficio neto no aplican (mismo
        # motivo que el P/E) y los márgenes bruto/operativo tampoco (arrendamiento neto).
        "roe", "roa", "net_margin", "roic_wacc", "gross_margin", "operating_margin"]
GROWTH_PRE_PROFIT = ["pe", "peg", "forward_pe", "graham", "eps_growth", "altman",   # DCF solo con FCF < 0 (en código);
                     # Altman -> runway en Solidez (etapa 7). Etapa 9a: rentabilidad con margen
                     # bruto, margen operativo (bandas propias) y su mejora, y margen FCF − SBC.
                     "roe", "roa", "net_margin", "roic_wacc"]
CYCLICAL = ["pe", "peg", "forward_pe", "fcf_growth"]
# Etapa 11b: UTILITY regulada. Se valora por P/E y rentabilidad por dividendo; la solidez,
# por deuda neta/EBITDA con bandas propias. El FCF es negativo por diseño (la inversión en
# la base regulada supera al flujo operativo), así que FCF, P/FCF, DCF y su crecimiento no
# aplican; tampoco el Altman ni el D/E genérico (deuda alta y circulante negativo por diseño).
UTILITY = ["altman", "de", "current_ratio", "fcf", "fcf_to_ni", "p_fcf", "fcf_growth", "dcf",
           "ev_ebitda", "peg", "garp"]
MATURE = []
GROWTH_PROFITABLE = []   # fase 3 (T2): con las herramientas de MATURE hasta la T3/T6 (provisional)
