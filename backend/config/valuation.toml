[pb_two_stage]                      # F9 · R1b (revisión externa de NU, 27-oct): lib/archetype_metrics.apply_two_stage
# Un banco cuyo valor en libros crece muy por encima de g (NU: 33,6 % anual) queda subvalorado por el Gordon de una
# etapa. Por encima de este crecimiento (CAGR de 3 años del valor en libros), el P/B justificado pasa a dos etapas:
# `years` años con g₁ = mín(crecimiento observado, ROE × retención) y después g con el ROE de la industria regional de
# Damodaran (convergencia: decisión del PM; mantener un ROE alto para siempre es el supuesto que la auditoría criticó
# en el DCF). Sin ROE de la industria, una etapa, declarado. Los bancos maduros (JPM 10,8 %) no lo activan.
bv_growth_threshold = 0.20
years = 5

