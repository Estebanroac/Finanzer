# Fase 2b (T6, F2_PRECEDENCIA §5): beta del sector para cuando la beta propia no es fiable (R² < min_r2 o menos de
# 52 semanas). Fuente citable: A. Damodaran, "Betas by Sector (US)", NYU Stern, actualización de enero de 2026
# (https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html), columna "Beta": media de las betas de
# regresión de las empresas de cada industria (consultada el 2026-10-16). Es la beta de un sector, no la estimación
# de una empresa: entra YA ajustada (Blume corrige el error de estimación de una sola regresión; una media de
# industria no lo tiene), y lib/beta.py lo declara.

source = "A. Damodaran, Betas by Sector (US), NYU Stern, enero de 2026 (columna Beta)"
url = "https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html"
as_of = "2026-01"

