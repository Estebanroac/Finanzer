# Reglas de cordura del modelo general (lib/model_invariants.py; tools/universe_scan.py las corre sobre el universo).
# Miden la salida del análisis de cualquier empresa: no cambian ninguna puntuación. Cada regla tiene aquí su umbral y
# su peso para ordenar las violaciones más graves (peso × magnitud, la magnitud acotada a `max_magnitude`).
# Pesos: 3 = la cifra puntúa o mueve el veredicto; 2 = entra en el coste de capital o en una cifra de cabecera;
# 1 = presentación (la cifra se enseña mal o sin motivo).

max_magnitude = 5.0

[margen_neto_techo]                 # margen neto ≤ (margen operativo + financieros netos / ingresos) × (1 − t) + tol
weight = 3
tolerance_pp = 0.02                 # la propuesta de la revisión de NVIDIA (2 pp)

[margen_operativo_unico]             # el margen operativo enseñado (EDGAR TTM; sin TTM, quoteSummary) frente al de las
weight = 3                          # piezas de la normalización (Yahoo, 4 trimestres); puntúa en Rentabilidad
tolerance_pp = 0.03                 # PM, 29-oct (FIX: 7,9 % de EDGAR frente a 16,7 % de Yahoo)

[ebitda_sin_amortizacion_operativa] # el D&A del EBITDA sin amortizaciones de activos operativos recurrentes (NFLX:
weight = 3                          # contenido); materialidad: thresholds.normalization.nonoperating_tolerance_revenue

[ke_sobre_kd]                       # Ke ≥ Kd + 1 pp (el suelo del propio motor: valuation.wacc.ke_floor_over_kd)
weight = 2
min_gap = 0.01

[beta_en_rango]                     # la beta propia pasa los filtros del motor (market.beta_choice) o se sustituye;
weight = 2                          # y la beta que entra en el Ke queda dentro de este rango
used_range = [0.4, 2.5]             # el mismo que market.beta_choice.own_range

[g_terminal_bajo_rf]                # el crecimiento terminal del DCF no supera la tasa libre de riesgo
weight = 2
tolerance = 0.0

[capitalizacion]                    # capitalización = precio × acciones
weight = 2
tolerance = 0.02

[roe_patrimonio_negativo]           # ROE no significativo si el patrimonio ≤ 0 (ni puntúa ni se enseña como cifra)
weight = 3

[peg_crecimiento_no_positivo]       # PEG no significativo si el crecimiento del BPA del informe ≤ 0
weight = 3

[cifra_unica]                       # una sola cifra por métrica y periodo en el display y en el PDF (tests/coherence.py)
weight = 1
max_listed = 10                     # violaciones listadas por empresa (el recuento es el total)

[peso_en_referencia]                # la empresa no pesa más que esto en el agregado de su propia industria
weight = 3
max_share = 0.20                    # la propuesta de la revisión de NVIDIA (20 %)
# Con menos empresas del universo en la industria, la cota (su suma) no informa: sola en el universo pesa el 100 %.
min_universe_peers = 3

[crecimiento_robusto]               # el crecimiento que puntúa no es un CAGR desde un año base anómalo
weight = 3
# Un año base anómalo es el del propio motor (thresholds.growth.anomalous_base_ratio). Un motivo con alguna de estas
# palabras declara un método robusto (regresión log-lineal, mitades del ciclo, ciclo medio): no es violación.
robust_markers = ["log-lineal", "regresión", "mitad", "ciclo medio", "pico a pico"]

[alertas_coherentes]                # ninguna fortaleza o alerta contradice una cifra mostrada
weight = 2
# Rótulo de una alerta (expresión regular, sin distinguir mayúsculas) -> clave de la cifra en el display. La primera
# que casa decide. Un rótulo con alguna de `other_basis_markers` cita otra base de la cifra (normalizada, sin el pico
# del beneficio, a ciclo medio) y no se compara con la cifra reportada.
other_basis_markers = ["normalizad", "sin el pico", "ciclo medio", "creíble"]
labels = [
    ["\\bforward p/e\\b", "forward_pe"],
    ["\\bp/e\\b", "pe"],
    ["\\bev/ebitda\\b", "ev_ebitda"],
    ["\\bp/fcf\\b", "pfcf"],
    ["\\bpeg\\b", "peg"],
    ["\\bp/b\\b", "pb"],
    ["fcf yield", "fcf_yield"],
    ["\\broe\\b", "roe"],
    ["\\broa\\b", "roa"],
    ["margen neto", "net_margin"],
    ["margen operativo", "operating_margin"],
    ["margen bruto", "gross_margin"],
    ["\\bbeta\\b", "beta"],
    ["piotroski", "piotroski"],
    ["altman", "altman"],
    ["deuda neta/ebitda", "net_debt_to_ebitda"],
    ["cobertura", "interest_coverage"],
    ["liquidez", "current_ratio"],
]

[beta_unica]                        # una misma beta en el Ke, el WACC, el P/B justificado, el display y las alertas
weight = 2
tolerance = 0.005

[estados_al_dia]                    # estados desfasados (o muy antiguos) siempre con su marca visible
weight = 1
max_days_ttm = 150                  # un 10-Q se presenta a los 40–45 días del cierre: 1 trimestre + plazo + holgura
max_days_fy = 480                   # un 20-F, hasta 4 meses después de un ejercicio de 12

[confianza_cobertura]               # la confianza del veredicto no supera el nivel de su cobertura
weight = 1

[motivo_de_vacio]                   # cada «no aplica», «sin dato» o «no significativo» lleva su motivo
weight = 1
min_reason_chars = 8
max_listed = 10

# ── F11 · revisión externa de NU y NFLX (docs/fiabilidad/revision-nu-nflx-2026-11-04.md) ──
[caida_avisada]                     # una caída en 1 año bajo thresholds.alerts.drawdown.deep_below sale en las alertas
weight = 2

[riesgo_critico_medido]             # cobertura «alta» exige medido el riesgo crítico de su tipo (crédito en bancos)
weight = 2

[una_definicion_ttm_fy]             # EDGAR manda en la serie anual (discrepancia > data.edgar.fy_series_reconcile_rel)
weight = 3                          # ⇒ el TTM del mismo campo no viene de la fuente
cut_keys = [["revenue", "totalRevenue"], ["operating_income", "operatingIncome"], ["net_income", "netIncome"],
            ["capex", "capitalExpenditures"]]

[implicito_mismo_modelo]            # con el justificado en dos etapas, el implícito y su sensibilidad también
weight = 2
tolerance = 0.05                    # la sensibilidad a ±0 frente al justificado

[cota_aplicada]                     # el crecimiento que puntúa respeta su cota (growth_basis.*.bound) y su rótulo
weight = 3
series = [["revenue_cagr", "Crecimiento de ingresos"], ["fcf_cagr", "Crecimiento del FCF"],
          ["eps_cagr", "Crecimiento del BPA"]]

[referencia_representativa]         # la referencia de industria gana algo y, si son pares, de su región
weight = 3
profit_columns = ["roe", "net_margin", "operating_margin"]
min_abs = 0.02                      # la propuesta de la revisión (2 %)
max_other_region_share = 0.5

[voto_estable]                      # el DCF directo vota solo si ±1 escalón de WACC no cruza el precio
weight = 3

[inverso_tasa_base]                 # el DCF inverso no lee «barata» con una tasa base menor que esto
weight = 3
cheap_bands = ["barata"]
min_share = 0.5

[convergencia_independiente]        # convergencia «alta» sin el mismo ancla en los dos métodos
weight = 2

[calidad_sin_saturar]               # Calidad de ganancias no al máximo con la prueba de acumulaciones fallida
weight = 3

[forward_creible]                   # la compresión del Forward P/E suma solo con un crecimiento implícito ≤ esto
weight = 3
max_implied_growth = 0.25           # la propuesta de la revisión para MATURE

[beta_contrastada]                  # la beta sustituta dentro de la propia ± k errores estándar
weight = 2
k_se = 2.0
min_r2 = 0.10                       # por debajo, la beta propia no informa (KO, HSY: R² ≈ 0 recalculado aparte)

[causalidad_sostenida]              # «propio de la empresa» frente a su país; sobrerreacción con evidencia
weight = 2

[metodo_citado_aplicable]           # el PDF no titula ni cita métodos que su tipo excluye
weight = 1

[escaneo]                           # tools/universe_scan.py
batch_size = 20                     # empresas por lote; entre lotes, una pausa
pause_between_batches_s = 10.0
workers = 2                         # análisis a la vez (EDGAR ya se limita a 8 peticiones/s en lib/sec_edgar.py)
top_n = 20
# Límites compartidos con las demás sesiones (PM, 28-oct): el cerrojo de EDGAR de lib/sec_edgar.py es por proceso y la
# clave gratuita de Finnhub es la misma para todos. Dentro del escaneo, por encima de los de la app:
edgar_max_rps = 5.0
finnhub_max_per_min = 30
# Lo que el análisis pide a Finnhub y las reglas no usan (titulares, sorpresas, calendario de resultados): no se pide.
finnhub_skip_paths = ["/company-news", "/stock/earnings", "/calendar/earnings"]
# Vigilancia (PM): pasados `check_after_min`, si el ritmo proyecta más de `max_minutes` o la memoria pasa de
# `max_rss_mb`, el escaneo se para (lo hecho queda en la caché y en el informe).
check_after_min = 10.0
max_minutes = 60.0
max_rss_mb = 450.0

# ── F13 (revisión externa de 110 empresas, 5-nov-2026): docs/fiabilidad/revision-110-2026-11-05.md ──
[rating_contable]                   # [3] rating de impago con EBIT normalizado o flujo operativo positivos
weight = 3
low_ratings = ["D", "C", "CC", "CCC"]

[cautiva_separada]                  # [8] deuda de la financiera cautiva fuera de la deuda industrial
weight = 3

[inverso_una_vez]                   # [1a] el DCF inverso, una sola vez en la convergencia
weight = 3

[confianza_base_fragil]             # [1b, 1c, 11a] confianza alta con base frágil
weight = 3
max_pe_gap = 0.40                   # |P/E normalizado ÷ forward − 1| (revisor: 40 %)

[ciclica_por_industria]             # [6] productores de materias primas (decisión del usuario, 5-nov: minería, petróleo y
weight = 3                          # gas, químicos básicos, acero, fertilizantes); nombres de industria de Yahoo
commodity_industries = ["copper", "steel", "aluminum", "other industrial metals & mining", "gold", "silver",
                        "other precious metals & mining", "coking coal", "thermal coal", "uranium", "oil & gas e&p",
                        "oil & gas refining & marketing", "oil & gas integrated", "oil & gas drilling",
                        "chemicals", "agricultural inputs"]

[pico_ciclico]                      # [6] beneficio TTM ÷ mediana de 3 ejercicios
weight = 3
min_ratio = 1.5                     # revisor: 1,5×

[referencia_acotada]                # [4] referencia sin la empresa: mínimo, ROE máximo y factor frente a la publicada
weight = 3
profit_columns = ["roe", "net_margin", "operating_margin"]
min_value = 0.02                    # revisor: 3 %; decisión del usuario (5-nov): 2 % fijo provisional
cause_band_max = 0.03               # entre el 2 % y el 3 %, la referencia debe llevar su prueba por causa
max_roe = 1.0
max_factor = 3.0

[roe_bajo_coherente]                # [4b] «ROE bajo» con ROE ≥ Ke
weight = 1

[roe_patrimonio_infimo]             # [4c] patrimonio ÷ activos
weight = 2
min_equity_to_assets = 0.05

[utility_regulada]                  # [10a]
weight = 3

[normalizacion_utility]             # [nuevo] parte del beneficio que la normalización quita como «no explicada»
weight = 3
min_share = 0.15

[espectro_coherente]                # [9a]
weight = 3

[perimetro_corregido]               # [5]
weight = 3

[ffo_sin_saltos]                    # [10d] máximo ÷ mínimo de la serie de FFO por acción
weight = 3
max_range_factor = 1.6

[abstencion_sin_datos]              # [11b]
weight = 3

[beta_sin_signo_negativo]           # [nuevo]
weight = 2

[flujo_por_intensidad]              # [2] capex ÷ flujo operativo medio
weight = 3
min_capex_to_ocf = 0.6              # capex ÷ flujo operativo del TTM (revisor: 60 %)

[crecimiento_dcf_representativo]    # [7a] DCF extremo con el crecimiento de ventas lejos del del BPA
weight = 3
min_abs_upside = 60
max_gap = 0.10

[base_inflada]                      # paso 12 (usuario): base del CAGR a 3 años frente a la mediana del resto
weight = 3
min_years = 6
min_factor = 1.5
series = [["free_cash_flow", "FCF"], ["revenue", "Ingresos"], ["net_income", "Beneficio neto"]]
engine_series = { free_cash_flow = "fcf_cagr", revenue = "revenue_cagr", net_income = "eps_cagr" }
