# Fase 3 (T1, parada 1; F3_DISENO_METODO §8.1): tasas base del crecimiento de las ventas, la referencia principal del
# DCF inverso. Fuente oficial: M. J. Mauboussin y D. Callahan, "The Impact of Intangibles on Base Rates", Consilient
# Observer, Counterpoint Global (Morgan Stanley Investment Management), 23 de junio de 2021; PDF vigente
# (© 2025 Morgan Stanley, 14 páginas), Exhibit 3 (pp. 6–8), "Base Rates for Sales Growth by Size and Industry,
# 1984-2020". Descargado con permiso del usuario el 2026-10-16 (registro #27) y extraído por programa del texto del PDF
# (pypdf); la fila "All" de cada tramo suma la del universo completo (test).
#
# Universo: constituyentes del Russell 3000 a fin de año, 1984–2020 (FactSet). Crecimiento NOMINAL de las ventas; los
# tramos de tamaño, por las ventas del año inicial en dólares de 2020 (se excluyen las de menos de 1 millón).
# Industrias: las cinco de Fama y French por código SIC, con las modificaciones de Ewens (Appendix B: hospitales a
# Consumer; radio y TV a Consumer). Manufacturing incluye energía y utilities; Other, minería, construcción,
# transporte, servicios a empresas, ocio y finanzas.
#
# Por tramo e industria: mediana, media y desviación típica del CAGR de ventas a 1, 3, 5 y 10 años, y el número de
# observaciones (empresa-periodo). Los autores advierten que la distribución no es normal (cola a la derecha); el uso
# en el motor (bandas del DCF inverso) se decide y se calibra en la T3.

source = "M. J. Mauboussin y D. Callahan, The Impact of Intangibles on Base Rates, Consilient Observer (Counterpoint Global, Morgan Stanley IM), 2021-06-23, Exhibit 3 (pp. 6-8)"
url = "https://www.morganstanley.com/im/en-us/individual-investor/insights/consilient-observer/the-impact-of-intangibles-on-base-rates.html"
as_of = "2021-06-23"
period = "1984-2020"
growth = "nominal"
horizons_years = [1, 3, 5, 10]

# Uso en el motor (fase 3, T3; lib/base_rates.py): proporción de comparables que sostuvo un crecimiento, con una
# lognormal ajustada a la mediana y la desviación típica de la celda.
min_count = 100                 # con menos observaciones en la celda (a ese horizonte), la fila "All" del tramo

[size]
# Ventas de hoy a dólares de 2020: IPC-U de EE. UU., media anual (BLS, serie CUUR0000SA0): 2020 = 258.811,
# 2024 = 313.689 -> 258.811 / 313.689 = 0.825. Se actualiza con la media anual más reciente publicada.
deflator_to_2020 = 0.825

[industry_map]
# Sector de Yahoo -> industria de Fama y French 5 (aproximación declarada; FF5 clasifica por SIC: software y
# telecomunicaciones son HiTec; energía y utilities, Manufacturing; finanzas, transporte y construcción, Other).
"technology" = "Technology"
"communication services" = "Technology"
"healthcare" = "Healthcare"
"consumer cyclical" = "Consumer"
"consumer defensive" = "Consumer"
"industrials" = "Manufacturing"
"energy" = "Manufacturing"
"utilities" = "Manufacturing"
"basic materials" = "Manufacturing"
"real estate" = "Other"
"financial services" = "Other"

[bins]                          # tramo -> ventas mínimas del año inicial, en miles de millones de USD de 2020
"0-1" = 0
"1-5" = 1
"5-10" = 5
"10-25" = 10
"25-50" = 25
"50-100" = 50
"100+" = 100

