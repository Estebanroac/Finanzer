# Umbrales de la capa de validación de entrada (lib/validate.py, etapa 3).
# Política: recalcular por definición desde los estados con flag; si no, None
# con flag y motivo; nunca en silencio.

[thresholds]
# FCF <= OCF (mismo periodo). Tolerancia absoluta por redondeos de la fuente.
fcf_over_ocf_tolerance_abs = 1e6
# Márgenes válidos: [-1000%, 100%] (en decimal).
margin_min = -10.0
margin_max = 1.0
# Saltos interanuales (FY actual / FY previo) considerados anómalos.
revenue_jump_ratio_max = 5.0
revenue_jump_ratio_min = 0.2
net_income_jump_ratio_max = 20.0   # mismo signo, |actual/previo|
net_income_jump_ratio_min = 0.05
# Acciones: fuera de [0.5x, 2x] entre ejercicios -> sospecha de base de split.
shares_ratio_min = 0.5
shares_ratio_max = 2.0
split_match_tolerance = 0.15       # |ratio / factor − 1|
# Guarda anti-artefacto del crecimiento (validate.growth_guard, que también usa
# finnhub_fallback): el YoY se acepta si |YoY| <= 60% o <= 3 × |CAGR largo|.
growth_artifact_abs_pct = 60.0
growth_artifact_lt_multiple = 3.0
# Unidades: |crecimiento| > 1000% o yield > 50% delatan escala porcentual.
growth_units_abs_max = 10.0
dividend_yield_max = 0.5
# Guardián de identidades (tests/guardian.py): el dividendo indicado no puede superar este múltiplo de lo cobrado en
# 12 meses (ni el yield el de payout × E/P) sin una subida verificada, ni quedar por debajo de lo cobrado / este
# múltiplo sin un extraordinario o un recorte dichos (fase 2b: magnitudes equivalentes, en los dos sentidos). El
# motor ya no anula el dato con él (fase 1, retirado en la 2b). Calibrado en el panel; justificación en
# docs/fiabilidad/F1_DIFF_GOLDEN.md (P3.7).
dividend_identity_max_ratio = 2.0
payout_ratio_max = 10.0

# Etapa 11b: moneda y clase de los estados frente a la cotización (lib/currency.py).
[currency]
fx_history_period = "7y"           # cierres diarios de Yahoo "XXX=X" (cubren los 4-5 ejercicios)
min_fx_days = 10                   # cierres mínimos en un período para promediarlo
share_class_tolerance = 1.5        # acciones de los estados / de la cotización fuera de [1/1.5, 1.5] -> otra clase

# Etapa 11b: plausibilidad de los múltiplos por acción. Fuera de rango -> inválido,
# no puntúa (flag con motivo, nunca en silencio).
[plausibility]
pe_min = 1.0
pe_max = 1000.0
pb_min = 0.05
eps_vs_net_income_max_dev = 0.20   # |BPA × acciones − beneficio neto| / |beneficio neto|

# Etapa 11b: filas de los estados anuales que cada arquetipo necesita. Si falta alguna, la
# validación deja un aviso (no corrige nada): el componente que la usa queda sin dato.
# Claves de _statements_fy (yf_adapter); "common" aplica a todos.
[required_rows]
common = ["revenue", "net_income", "total_assets", "stockholders_equity"]
FINANCIAL = []
REIT = ["operating_cash_flow", "depreciation_amortization"]
UTILITY = ["operating_cash_flow", "ebitda"]
GROWTH_PRE_PROFIT = ["operating_cash_flow", "capital_expenditure", "stock_based_compensation"]
CYCLICAL = ["operating_cash_flow", "capital_expenditure", "depreciation_amortization"]
MATURE = ["operating_cash_flow", "capital_expenditure"]
GROWTH_PROFITABLE = ["operating_cash_flow", "capital_expenditure"]   # fase 3 (T2): las de MATURE hasta la T3
