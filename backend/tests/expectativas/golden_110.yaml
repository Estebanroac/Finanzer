reglas_globales:
- id: R1
  regla: 'Confianza alta prohibida con alerta roja de solvencia: Altman en zona de peligro (cuando aplica), EBIT
    normalizado negativo o caja libre negativa en 2 de los últimos 3 años.'
- id: R2
  regla: Confianza alta prohibida si el DCF directo supera ±150% o si el P/E normalizado y el forward difieren más
    de 40%.
- id: R3
  regla: Ningún productor de materias primas (minería, petróleo y gas, química básica, acero, fertilizantes) se
    clasifica fuera de CYCLICAL.
- id: R4
  regla: Ninguna cíclica con beneficio actual mayor a 1.5 veces su mediana puede salir «atractivo» con confianza
    mayor que «baja».
- id: R5
  regla: Sin veredicto de precio si la cotización no tiene sesiones en los últimos 10 días hábiles.
- id: R6
  regla: El crecimiento usado en el DCF nunca tiene signo contrario al de la empresa.
- id: R7
  regla: Tasa libre de riesgo leída de la hoja de Damodaran del mes vigente; alarma si no cambia de un mes a otro
    o si se aleja más de 0.3 pp del bono.
- id: R8
  regla: Coste de capital entre 5% y 15%, salvo cobertura de intereses negativa con el beneficio normalizado.
- id: R9
  regla: Ninguna referencia de industria con menos de 10 empresas o con margen deprimido puntúa sin decir la causa.
- id: R10
  regla: No se muestra ROE como fortaleza si el patrimonio es menor al 5% de los activos.
- id: R11
  regla: Ningún método solo (sin confirmación de otro) puede llevar el precio a la nota mínima ni a «muy exigente».
