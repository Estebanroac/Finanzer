# MUESTRA DE CONTROL (contra el sobreajuste)
#   Seleccionar al azar, con semilla fija y estratificado por sector, 300 empresas
#   del universo que NO estén entre estas 110. Nadie las revisa ni se usan para
#   ajustar el motor. Al cerrar cada versión, se mide en ellas:
#     - número de incumplimientos de las reglas globales;
#     - distribución de etiquetas de precio y de confianza.
#   Si una mejora aparece en las 110 y no en el control, es sobreajuste.
#
# DEFINICIÓN DE «TERMINADO» (v4)
#   1. Cero incumplimientos de las reglas globales en las 110 y en el control.
#   2. Al menos el 90% de las 110 cumple sus expectativas (hoy: ver arriba).
#   3. Ninguna empresa que hoy cumple deja de cumplir (sin regresiones).
#   4. En el control, la proporción de «muy exigente» y de confianza baja no se
#      aleja más de 10 pp de la de las 110.
#   Cumplido esto, la versión se congela. Todo hallazgo nuevo va a la lista de la
#   v5, salvo los errores críticos (reglas globales), que se corrigen en el ciclo.
#
# CAMBIOS HECHOS (registro)
#   6-nov · F15 (aprobado por Esteban): TXN, PLD y MOS re-ancladas al banco congelado del 5-nov
#   (archivo-historico/evidencias-de-pruebas/f13_banco110_2026-11-05): sus «actual ±1» venían de datos vivos del
#   6-nov y con los datos congelados el motor previo a F15 daba otra etiqueta. Las demás ya cumplían con el banco.
#
# CAMBIOS A ESTE ARCHIVO
#   Solo con aprobación explícita de Esteban, y nunca para que un cambio del motor
#   pase la prueba. Si una expectativa resulta equivocada, se corrige con su razón.
