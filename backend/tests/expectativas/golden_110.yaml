# =====================================================================
# Finanzer · Expectativas de referencia (golden) · 110 empresas
# Borrador v0.1 · 6 de noviembre de 2026 · PENDIENTE DE VALIDAR POR ESTEBAN
# =====================================================================
#
# QUÉ ES
#   Las evaluaciones de las tres revisiones, convertidas en expectativas que se
#   comprueban de forma automática. No fija cifras exactas: fija rangos aceptables
#   y límites. Un cambio en el motor se acepta si no rompe expectativas que hoy se
#   cumplen y no viola ninguna regla global.
#
# CÓMO SE EVALÚA CADA EMPRESA
#   precio_aceptable  la etiqueta final de precio del veredicto debe estar en la lista.
#                     Escala (de cara a barata):
#                       muy exigente < entre exigente y muy exigente < exigente
#                       < entre razonable y exigente < razonable
#                       < entre razonable y atractivo < atractivo
#                     «sin veredicto» = el motor no da precio.
#   confianza_max     la confianza no puede ser mayor que esta (baja < media < alta).
#   arquetipo         la clasificación debe ser una de estas.
#   arquetipo_no      la clasificación no puede ser ninguna de estas.
#   debe_mostrar      texto que debe aparecer en el análisis (alerta o riesgo).
#   fuente            explícita = criterio experto de la revisión;
#                     regla = solo límites (confianza o arquetipo), precio actual ±1 paso;
#                     actual ±1 = veredicto ya validado, se acepta un paso de la escala.
#
# DATOS DE ENTRADA
#   Las expectativas se comprueban con los datos de entrada CONGELADOS (precios,
#   estados, Damodaran) de una fecha fija, no con datos vivos. Si no, la variación
#   entre ejecuciones (caso Prologis) se confunde con el efecto de un cambio.
#   Al congelar, guardar la fecha y la versión de cada fuente.
#
# ESTADO CON LA RONDA DEL 6 NOV (TARDE)
#   Cumplen 93 de 110 (85%). Fallan 17:
#     NVDA   precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente', 'entre razonable y exigente']
#     GOOGL  precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']
#     META   precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']
#     T      confianza media > baja
#     HD     precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']
#     PG     precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']
#     KHC    confianza media > baja
#     JNJ    precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']; confianza alta > media
#     MRK    precio «muy exigente» fuera de ['exigente', 'entre razonable y exigente', 'razonable']
#     ABBV   precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente', 'entre razonable y exigente']
#     MDT    precio «entre exigente y muy exigente» fuera de ['exigente', 'entre razonable y exigente', 'razonable']
#     MRNA   arquetipo MATURE no permitido
#     GS     precio «exigente» fuera de ['entre razonable y exigente', 'razonable']
#     V      precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']
#     BLK    precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente', 'entre razonable y exigente']
#     MMM    precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente', 'entre razonable y exigente']
#     LIN    precio «muy exigente» fuera de ['entre exigente y muy exigente', 'exigente']
#   12 de los 17 fallos son «muy exigente» en empresas de calidad alta: apuntan a una
#   sola causa (cómo se combinan los métodos de precio), no a 12 problemas distintos.
#
# REGLAS GLOBALES (aplican a todo el universo, no solo a estas 110)
#   Un solo incumplimiento es un error crítico.
