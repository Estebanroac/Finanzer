[pytest]
testpaths = .
# Sin .pytest_cache dentro del repo; -ra resume xfail/xpass al final.
addopts = -p no:cacheprovider -ra
# Un bug "conocido" que deja de fallar (XPASS) rompe la suite a propósito:
# así se detecta que quedó corregido y hay que quitar su marca xfail.
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:urllib3 v2 only supports OpenSSL
